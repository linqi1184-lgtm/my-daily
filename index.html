<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>每日管理</title>
<style>
:root{
  --primary:#4a90d9;--primary-bg:#e8f1fb;--success:#52c41a;--danger:#f5222d;
  --warn:#faad14;--text:#1a1a1a;--text2:#888;--border:#eee;--bg:#f5f5f5;--card:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow:hidden}
.app{display:flex;height:100vh}
/* Sidebar */
.sidebar{width:72px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;gap:4px}
.nav-item.active{background:var(--primary-bg);border-left-color:var(--primary)}
.nav-item .icon{font-size:22px}
.nav-item .label{font-size:10px;color:var(--text2);white-space:nowrap}
.nav-item.active .label{color:var(--primary);font-weight:600}
/* Content */
.content{flex:1;overflow-y:auto;padding:16px 14px;max-width:640px;margin:0 auto;width:100%}
.date-bar{font-size:13px;color:var(--text2);margin-bottom:14px;text-align:center}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.badge{background:var(--primary-bg);color:var(--primary);font-size:12px;padding:2px 10px;border-radius:10px;font-weight:600}
/* Weekly goal */
.weekly-goal{background:var(--primary-bg);border-radius:8px;padding:12px;margin-bottom:14px}
.weekly-goal label{font-size:13px;font-weight:600;color:var(--primary);display:block;margin-bottom:6px}
.weekly-goal textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px;resize:vertical;min-height:50px;background:#fff;font-family:inherit}
/* Checkbox item */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.check-item:last-child{border-bottom:none}
.checkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.checkbox.checked{background:var(--success);border-color:var(--success);color:#fff}
.checkbox.checked::after{content:'✓';font-size:16px;font-weight:700}
.check-label{flex:1;font-size:15px}
.check-label.done{text-decoration:line-through;color:var(--text2)}
.check-del{color:var(--danger);cursor:pointer;font-size:16px;padding:4px;opacity:.4}
.check-del:active{opacity:1}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit}
.add-row input:focus{outline:none;border-color:var(--primary)}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-sm{padding:6px 12px;font-size:13px}
/* Progress bar */
.progress-info{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}
.progress-info .big{font-size:18px;font-weight:700;color:var(--primary)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
/* English */
.en-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.en-item:last-child{border-bottom:none}
.en-info{flex:1}
.en-name{font-size:15px;font-weight:500}
.en-name.done{text-decoration:line-through;color:var(--text2)}
.en-count-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.en-count-row input{width:60px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}
.movie-list{margin-top:6px}
.movie-entry{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.movie-entry input{padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}
.add-task-btn{border:1px dashed var(--border);border-radius:6px;text-align:center;padding:10px;cursor:pointer;color:var(--text2);margin-top:8px}
.add-task-btn:active{background:var(--primary-bg);color:var(--primary)}
.progress-info-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.progress-info-row .val{font-weight:600}
/* Novel */
.novel-stats{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:var(--card);border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-box .num{font-size:22px;font-weight:700}
.stat-box .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.speed-box{flex:1;background:var(--card);border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.speed-box .num{font-size:22px;font-weight:700;color:var(--warn)}
.speed-box .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.novel-toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.novel-toolbar button{padding:4px 12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit}
.novel-toolbar button:active{background:var(--primary-bg)}
.novel-editor{min-height:300px;border:1px solid var(--border);border-radius:6px;padding:12px;font-size:15px;line-height:1.8;outline:none;overflow-y:auto;max-height:400px}
.novel-editor:empty::before{content:attr(data-placeholder);color:var(--text2)}
.section-gap{height:8px}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:14px}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
// ===== DATA =====
var D={};
var STORE_KEY='daily_app_v4';
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(D))}
function loadData(){
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){D=JSON.parse(raw)}else{D={}}}catch(e){D={}}
  if(!D.exercise)D.exercise={weekly:{},daily:{}};
  if(!D.exercise.weekly)D.exercise.weekly={};
  if(!D.exercise.daily)D.exercise.daily={};
  if(!D.english)D.english={};
  if(!D.novel)D.novel={content:'',weekly:{},baseline:{}};
  if(!D.novel.weekly)D.novel.weekly={};
  if(!D.novel.baseline)D.novel.baseline={};
  if(!D.media)D.media={weekly:{},daily:{}};
  if(!D.media.weekly)D.media.weekly={};
  if(!D.media.daily)D.media.daily={};
}
// ===== UTILS =====
var WEEKDAYS=['日','一','二','三','四','五','六'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekKey(d){d=d||new Date();var day=d.getDay()||7;d=new Date(d);d.setDate(d.getDate()-day+1);return dateKey(d)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(){var d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEKDAYS[d.getDay()]}
function fmtWeekRange(wk){var monday=new Date(wk);var sun=new Date(wk);sun.setDate(sun.getDate()+6);return (monday.getMonth()+1)+'/'+monday.getDate()+' ~ '+(sun.getMonth()+1)+'/'+sun.getDate()}
var DAILY_GOAL=10000;
var _timers={};
function debounce(fn,key,ms){ms=ms||500;if(_timers[key])clearTimeout(_timers[key]);_timers[key]=setTimeout(fn,ms)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}
function countWords(html){var tmp=document.createElement('div');tmp.innerHTML=html;var text=tmp.textContent||tmp.innerText||'';return text.replace(/\s/g,'').length}
// ===== NAV =====
var NAV=[
  {id:'exercise',icon:'💪',label:'锻炼'},
  {id:'english',icon:'📖',label:'学英语'},
  {id:'novel',icon:'✍️',label:'写小说'},
  {id:'media',icon:'📱',label:'自媒体'},
];
var currentPage='exercise';
function renderSidebar(){
  var html='';
  NAV.forEach(function(n){
    html+='<div class="nav-item'+(currentPage===n.id?' active':'')+'" data-page="'+n.id+'"><div class="icon">'+n.icon+'</div><div class="label">'+n.label+'</div></div>';
  });
  document.getElementById('sidebar').innerHTML=html;
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click',function(){
      currentPage=el.dataset.page;
      if(window._novelSpeedInterval){clearInterval(window._novelSpeedInterval);window._novelSpeedInterval=null}
      renderSidebar();renderPage();
    });
  });
}
function renderPage(){
  var c=document.getElementById('content');
  var html='<div class="date-bar">'+fmtDate()+'</div>';
  if(currentPage==='exercise')html+=renderExercise();
  else if(currentPage==='english')html+=renderEnglish();
  else if(currentPage==='novel')html+=renderNovel();
  else if(currentPage==='media')html+=renderMedia();
  c.innerHTML=html;
  if(currentPage==='exercise')initExercise();
  else if(currentPage==='english')initEnglish();
  else if(currentPage==='novel')initNovel();
  else if(currentPage==='media')initMedia();
}
// ===== ENSURE FUNCTIONS =====
function ensureExerciseDaily(dk){
  if(!D.exercise.daily[dk]){
    D.exercise.daily[dk]=[
      {id:uid(),label:'力量训练30分钟',done:false},
      {id:uid(),label:'有氧训练30分钟',done:false}
    ];
    save();
  }
  return D.exercise.daily[dk];
}
function ensureEnglish(dk){
  if(!D.english[dk])D.english[dk]={nc1:{done:false,count:0},nc2:{done:false,count:0},nc3:{done:false,count:0},movie:{done:false,movies:[]}};
  if(!D.english[dk].movie)D.english[dk].movie={done:false,movies:[]};
  if(!D.english[dk].movie.movies)D.english[dk].movie.movies=[];
  return D.english[dk];
}
function ensureNovel(){if(!D.novel)D.novel={content:'',weekly:{},baseline:{}};if(!D.novel.weekly)D.novel.weekly={};if(!D.novel.baseline)D.novel.baseline={};return D.novel}
function ensureMediaDaily(dk){
  if(!D.media.daily[dk]){
    D.media.daily[dk]=[
      {id:uid(),label:'写文案/脚本',done:false},
      {id:uid(),label:'拍摄/录制',done:false},
      {id:uid(),label:'剪辑',done:false},
      {id:uid(),label:'发布内容',done:false}
    ];
    save();
  }
  return D.media.daily[dk];
}
// ===================== PAGE: EXERCISE =====================
function renderExercise(){
  var dk=dateKey();var wk=weekKey();
  var items=ensureExerciseDaily(dk);
  var done=items.filter(function(i){return i.done}).length;
  var html='<div class="weekly-goal"><label>🎯 本周锻炼目标</label>';
  html+='<textarea id="ex-weekly" placeholder="例：本周锻炼5天，力量3次，有氧3次">'+esc(D.exercise.weekly[wk]||'')+'</textarea>';
  html+='<div style="font-size:12px;color:var(--text2);margin-top:4px">'+fmtWeekRange(wk)+'</div></div>';
  html+='<div class="card"><div class="card-title">今日锻炼 <span class="badge">'+done+'/'+items.length+'</span></div>';
  items.forEach(function(item){
    html+='<div class="check-item" data-id="'+item.id+'"><div class="checkbox'+(item.done?' checked':'')+'" data-action="toggle"></div><span class="check-label'+(item.done?' done':'')+'">'+esc(item.label)+'</span><span class="check-del" data-action="del">✕</span></div>';
  });
  html+='<div class="add-row"><input type="text" id="ex-add-input" placeholder="添加锻炼项目..." maxlength="30"><button class="btn btn-primary btn-sm" id="ex-add-btn">添加</button></div>';
  html+='</div>';
  // Weekly stats
  var weekDone=0,weekTotal=0;
  var monday=new Date(wk);
  for(var i=0;i<7;i++){
    var d=new Date(monday);d.setDate(d.getDate()+i);
    var dk2=dateKey(d);
    if(D.exercise.daily[dk2]){
      D.exercise.daily[dk2].forEach(function(it){weekTotal++;if(it.done)weekDone++});
    }
  }
  html+='<div class="card"><div class="card-title">本周统计</div>';
  html+='<div class="progress-info-row"><span>本周完成</span><span class="val">'+weekDone+'/'+weekTotal+'</span></div>';
  html+='</div>';
  return html;
}
function initExercise(){
  var dk=dateKey();var wk=weekKey();
  var items=D.exercise.daily[dk];
  // Toggle checkboxes
  document.querySelectorAll('.check-item').forEach(function(el){
    var id=el.dataset.id;var item=items.find(function(i){return i.id===id});if(!item)return;
    el.querySelector('[data-action=toggle]').addEventListener('click',function(){
      item.done=!item.done;save();renderPage();toast(item.done?'打卡成功':'取消打卡');
    });
    el.querySelector('[data-action=del]').addEventListener('click',function(){
      D.exercise.daily[dk]=items.filter(function(i){return i.id!==id});save();renderPage();toast('已删除');
    });
  });
  // Add item
  var addInput=document.getElementById('ex-add-input');
  var addBtn=document.getElementById('ex-add-btn');
  function addItem(){var v=addInput.value.trim();if(!v)return;items.push({id:uid(),label:v,done:false});save();renderPage();toast('已添加')}
  addBtn.addEventListener('click',addItem);
  addInput.addEventListener('keydown',function(e){if(e.key==='Enter')addItem()});
  // Weekly goal
  var wg=document.getElementById('ex-weekly');
  wg.addEventListener('input',function(){D.exercise.weekly[wk]=wg.value;debounce(function(){save();toast('已保存')},'ex_wg')});
}
// ===================== PAGE: ENGLISH =====================
var ENGLISH=[
  {id:'nc1',name:'新概念第一册'},
  {id:'nc2',name:'新概念第二册'},
  {id:'nc3',name:'新概念第三册'},
  {id:'movie',name:'英文电影整理'}
];
function renderEnglish(){
  var dk=dateKey();var en=ensureEnglish(dk);var done=0;
  var ncItems=[en.nc1,en.nc2,en.nc3];ncItems.forEach(function(item){if(item.done)done++});
  if(en.movie.done||(en.movie.movies&&en.movie.movies.length>0))done++;
  var html='<div class="card"><div class="card-title">今日英语学习 <span class="badge">'+done+'/4</span></div>';
  var ncList=[{id:'nc1',name:'新概念第一册',item:en.nc1},{id:'nc2',name:'新概念第二册',item:en.nc2},{id:'nc3',name:'新概念第三册',item:en.nc3}];
  ncList.forEach(function(nc){
    html+='<div class="en-item" data-id="'+nc.id+'"><div class="checkbox'+(nc.item.done?' checked':'')+'" data-action="toggle" style="margin-top:2px"></div><div class="en-info"><div class="en-name'+(nc.item.done?' done':'')+'">'+nc.name+'</div><div class="en-count-row"><span style="font-size:12px;color:var(--text2)">今日背诵篇数：</span><input type="number" min="0" value="'+(nc.item.count||0)+'" data-action="count" /><span style="font-size:12px;color:var(--text2)">篇</span></div></div></div>';
  });
  var movieChecked=en.movie.done;
  html+='<div class="en-item" data-id="movie"><div class="checkbox'+(movieChecked?' checked':'')+'" data-action="toggle" style="margin-top:2px"></div><div class="en-info"><div class="en-name'+(movieChecked?' done':'')+'">英文电影整理</div>';
  if(en.movie.movies&&en.movie.movies.length>0){
    html+='<div class="movie-list">';
    en.movie.movies.forEach(function(mv,i){
      html+='<div class="movie-entry" data-mi="'+i+'"><span>🎬</span><input type="text" value="'+esc(mv.name)+'" data-action="mvname" placeholder="电影名" style="width:140px" /><input type="number" min="0" value="'+(mv.minutes||0)+'" data-action="mvmin" placeholder="分钟" style="width:60px" /><span style="font-size:12px;color:var(--text2)">分钟</span><span class="check-del" data-action="mvdel" style="color:var(--danger);cursor:pointer;font-size:16px;padding:2px 6px">✕</span></div>';
    });
    html+='</div>';
  }
  html+='<div class="add-task-btn" data-action="addmovie"><span style="font-size:16px">＋</span> 添加一部电影</div>';
  html+='</div></div></div>';
  // Progress stats
  var totalEssays=(en.nc1.count||0)+(en.nc2.count||0)+(en.nc3.count||0);
  var movieTotalMin=0;var movieNames=[];
  if(en.movie.movies){en.movie.movies.forEach(function(mv){movieTotalMin+=(mv.minutes||0);if(mv.name)movieNames.push(mv.name)})};
  html+='<div class="card"><div class="card-title">进度统计</div>';
  html+='<div class="progress-info-row"><span>今日背诵总篇数</span><span class="val">'+totalEssays+'</span></div>';
  html+='<div class="progress-info-row"><span>新概念一册</span><span>'+(en.nc1.count||0)+' 篇</span></div>';
  html+='<div class="progress-info-row"><span>新概念二册</span><span>'+(en.nc2.count||0)+' 篇</span></div>';
  html+='<div class="progress-info-row"><span>新概念三册</span><span>'+(en.nc3.count||0)+' 篇</span></div>';
  html+='<div class="section-gap"></div>';
  html+='<div class="progress-info-row"><span>英文电影整理</span><span>'+movieTotalMin+' 分钟</span></div>';
  if(movieNames.length>0)html+='<div class="progress-info-row"><span>今日整理的电影</span><span style="color:#856404;font-weight:600">🎬 '+esc(movieNames.join('、'))+'</span></div>';
  html+='</div>';
  return html;
}
function initEnglish(){
  var dk=dateKey();var en=ensureEnglish(dk);
  var ncList=[{id:'nc1',item:en.nc1},{id:'nc2',item:en.nc2},{id:'nc3',item:en.nc3}];
  ncList.forEach(function(nc){
    var el=document.querySelector('.en-item[data-id="'+nc.id+'"]');
    if(!el)return;
    el.querySelector('[data-action=toggle]').addEventListener('click',function(){nc.item.done=!nc.item.done;save();renderPage();toast(nc.item.done?'打卡成功':'取消打卡')});
    var ci=el.querySelector('[data-action=count]');if(ci){ci.addEventListener('input',function(){nc.item.count=parseInt(ci.value)||0;debounce(function(){save()},'en_c_'+nc.id,500)});ci.addEventListener('click',function(e){e.stopPropagation()})}
  });
  var movieEl=document.querySelector('.en-item[data-id="movie"]');
  if(!movieEl)return;
  movieEl.querySelector('[data-action=toggle]').addEventListener('click',function(){en.movie.done=!en.movie.done;save();renderPage();toast(en.movie.done?'打卡成功':'取消打卡')});
  if(en.movie.movies){
    document.querySelectorAll('.movie-entry').forEach(function(mel){
      var mi=parseInt(mel.dataset.mi);var mv=en.movie.movies[mi];
      var nameInput=mel.querySelector('[data-action=mvname]');
      nameInput.addEventListener('input',function(){mv.name=nameInput.value;debounce(function(){save()},'en_mv_n_'+mi,300)});
      nameInput.addEventListener('click',function(e){e.stopPropagation()});
      var minInput=mel.querySelector('[data-action=mvmin]');
      minInput.addEventListener('input',function(){mv.minutes=parseInt(minInput.value)||0;debounce(function(){save()},'en_mv_m_'+mi,300)});
      minInput.addEventListener('click',function(e){e.stopPropagation()});
      mel.querySelector('[data-action=mvdel]').addEventListener('click',function(){en.movie.movies.splice(mi,1);save();renderPage();toast('已删除')});
    });
  }
  movieEl.querySelector('[data-action=addmovie]').addEventListener('click',function(){if(!en.movie.movies)en.movie.movies=[];en.movie.movies.push({id:uid(),name:'',minutes:0});save();renderPage()});
}
// ===================== PAGE: NOVEL =====================
var novelSpeedTracker={lastWordCount:0,lastTime:0,currentSpeed:0,samples:[],sampleWindow:60};
function updateTypingSpeed(currentCount){
  var now=Date.now();
  if(novelSpeedTracker.lastTime>0){var elapsed=(now-novelSpeedTracker.lastTime)/1000;
    if(elapsed>0.5){var wordsDiff=currentCount-novelSpeedTracker.lastWordCount;
      if(wordsDiff>0&&elapsed<300){var speed=Math.round(wordsDiff/(elapsed/60));
        novelSpeedTracker.samples.push({speed:speed,time:now});
        novelSpeedTracker.samples=novelSpeedTracker.samples.filter(function(s){return(now-s.time)<novelSpeedTracker.sampleWindow*1000});
        if(novelSpeedTracker.samples.length>0){var avg=novelSpeedTracker.samples.reduce(function(a,b){return a+b.speed},0)/novelSpeedTracker.samples.length;novelSpeedTracker.currentSpeed=Math.round(avg)}
      }
    }
  }
  novelSpeedTracker.lastWordCount=currentCount;novelSpeedTracker.lastTime=now;
}
function renderNovel(){
  var novel=ensureNovel();var dk=dateKey();var wk=weekKey();
  if(novel.baseline[dk]===undefined){novel.baseline[dk]=countWords(novel.content);save()}
  var totalWords=countWords(novel.content);var todayWords=totalWords-(novel.baseline[dk]||0);if(todayWords<0)todayWords=0;
  var pct=Math.min(100,Math.round(todayWords/DAILY_GOAL*100));
  novelSpeedTracker.lastWordCount=totalWords;novelSpeedTracker.lastTime=Date.now();
  var html='<div class="weekly-goal"><label>🎯 本周写作目标</label>';
  html+='<textarea id="novel-weekly" placeholder="例：本周写10000字，完成第3章">'+esc(novel.weekly[wk]||'')+'</textarea>';
  html+='<div style="font-size:12px;color:var(--text2);margin-top:4px">'+fmtWeekRange(wk)+'</div></div>';
  html+='<div class="card"><div class="card-title">每日写作目标 <span class="badge">'+pct+'%</span></div><div class="progress-info"><span>今日字数</span><span class="big">'+todayWords+' / '+DAILY_GOAL+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  html+='<div class="novel-stats"><div class="stat-box"><div class="num" style="color:var(--primary)">'+todayWords+'</div><div class="lbl">今日字数</div></div><div class="stat-box"><div class="num" style="color:var(--success)">'+totalWords+'</div><div class="lbl">总字数</div></div><div class="stat-box"><div class="num" style="color:#faad14">'+Math.max(0,DAILY_GOAL-todayWords)+'</div><div class="lbl">距目标</div></div><div class="speed-box"><div class="num" id="speed-display">0</div><div class="lbl">字/分钟</div></div></div>';
  html+='<div class="card"><div class="card-title">小说编辑器</div><div class="novel-toolbar"><button data-cmd="bold">B</button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="formatBlock" data-val="h3">标题</button><button data-cmd="formatBlock" data-val="p">正文</button></div><div class="novel-editor" id="novel-editor" contenteditable="true" data-placeholder="开始写作...">'+(novel.content||'')+'</div></div>';
  return html;
}
function initNovel(){
  var novel=ensureNovel();var dk=dateKey();var wk=weekKey();
  var editor=document.getElementById('novel-editor');var speedDisplay=document.getElementById('speed-display');
  document.querySelectorAll('.novel-toolbar button').forEach(function(btn){btn.addEventListener('mousedown',function(e){e.preventDefault()});btn.addEventListener('click',function(e){e.preventDefault();document.execCommand(btn.dataset.cmd,false,btn.dataset.val||null);editor.focus();onEditorChange()})});
  function onEditorChange(){
    novel.content=editor.innerHTML;var total=countWords(novel.content);var today=total-(novel.baseline[dk]||0);if(today<0)today=0;var pct=Math.min(100,Math.round(today/DAILY_GOAL*100));
    updateTypingSpeed(total);if(speedDisplay)speedDisplay.textContent=novelSpeedTracker.currentSpeed;
    var fill=document.querySelector('.progress-fill');if(fill)fill.style.width=pct+'%';
    var infoBig=document.querySelector('.progress-info .big');if(infoBig)infoBig.textContent=today+' / '+DAILY_GOAL;
    var badge=document.querySelector('.card-title .badge');if(badge)badge.textContent=pct+'%';
    var stats=document.querySelectorAll('.stat-box .num');if(stats[0])stats[0].textContent=today;if(stats[1])stats[1].textContent=total;if(stats[2])stats[2].textContent=Math.max(0,DAILY_GOAL-today);
    debounce(function(){save();toast('已自动保存')},'novel_save',800);
  }
  editor.addEventListener('input',onEditorChange);
  var speedDecayInterval=setInterval(function(){
    var now=Date.now();novelSpeedTracker.samples=novelSpeedTracker.samples.filter(function(s){return(now-s.time)<novelSpeedTracker.sampleWindow*1000});
    if(novelSpeedTracker.samples.length>0){var avg=novelSpeedTracker.samples.reduce(function(a,b){return a+b.speed},0)/novelSpeedTracker.samples.length;novelSpeedTracker.currentSpeed=Math.round(avg)}else{novelSpeedTracker.currentSpeed=0}
    if(speedDisplay)speedDisplay.textContent=novelSpeedTracker.currentSpeed;
  },2000);
  window._novelSpeedInterval=speedDecayInterval;
  // Weekly goal
  var wg=document.getElementById('novel-weekly');
  wg.addEventListener('input',function(){novel.weekly[wk]=wg.value;debounce(function(){save();toast('已保存')},'novel_wg')});
}
// ===================== PAGE: MEDIA =====================
function renderMedia(){
  var dk=dateKey();var wk=weekKey();
  var items=ensureMediaDaily(dk);
  var done=items.filter(function(i){return i.done}).length;
  var html='<div class="weekly-goal"><label>🎯 本周自媒体目标</label>';
  html+='<textarea id="media-weekly" placeholder="例：本周发布3条视频，2条图文">'+esc(D.media.weekly[wk]||'')+'</textarea>';
  html+='<div style="font-size:12px;color:var(--text2);margin-top:4px">'+fmtWeekRange(wk)+'</div></div>';
  html+='<div class="card"><div class="card-title">今日自媒体任务 <span class="badge">'+done+'/'+items.length+'</span></div>';
  items.forEach(function(item){
    html+='<div class="check-item" data-id="'+item.id+'"><div class="checkbox'+(item.done?' checked':'')+'" data-action="toggle"></div><span class="check-label'+(item.done?' done':'')+'">'+esc(item.label)+'</span><span class="check-del" data-action="del">✕</span></div>';
  });
  html+='<div class="add-row"><input type="text" id="media-add-input" placeholder="添加任务..." maxlength="30"><button class="btn btn-primary btn-sm" id="media-add-btn">添加</button></div>';
  html+='</div>';
  // Weekly stats
  var weekDone=0,weekTotal=0;
  var monday=new Date(wk);
  for(var i=0;i<7;i++){
    var d=new Date(monday);d.setDate(d.getDate()+i);
    var dk2=dateKey(d);
    if(D.media.daily[dk2]){
      D.media.daily[dk2].forEach(function(it){weekTotal++;if(it.done)weekDone++});
    }
  }
  html+='<div class="card"><div class="card-title">本周统计</div>';
  html+='<div class="progress-info-row"><span>本周完成</span><span class="val">'+weekDone+'/'+weekTotal+'</span></div>';
  html+='</div>';
  return html;
}
function initMedia(){
  var dk=dateKey();var wk=weekKey();
  var items=D.media.daily[dk];
  document.querySelectorAll('.check-item').forEach(function(el){
    var id=el.dataset.id;var item=items.find(function(i){return i.id===id});if(!item)return;
    el.querySelector('[data-action=toggle]').addEventListener('click',function(){
      item.done=!item.done;save();renderPage();toast(item.done?'完成！':'取消');
    });
    el.querySelector('[data-action=del]').addEventListener('click',function(){
      D.media.daily[dk]=items.filter(function(i){return i.id!==id});save();renderPage();toast('已删除');
    });
  });
  var addInput=document.getElementById('media-add-input');
  var addBtn=document.getElementById('media-add-btn');
  function addItem(){var v=addInput.value.trim();if(!v)return;items.push({id:uid(),label:v,done:false});save();renderPage();toast('已添加')}
  addBtn.addEventListener('click',addItem);
  addInput.addEventListener('keydown',function(e){if(e.key==='Enter')addItem()});
  var wg=document.getElementById('media-weekly');
  wg.addEventListener('input',function(){D.media.weekly[wk]=wg.value;debounce(function(){save();toast('已保存')},'media_wg')});
}
// ===================== INIT =====================
loadData();
renderSidebar();
renderPage();
</script>
