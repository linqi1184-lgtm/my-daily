<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>每日管理</title>
<style>
:root{
  --primary:#4a90d9;--primary-bg:#e8f1fb;--success:#52c41a;--danger:#f5222d;
  --warn:#faad14;--text:#1a1a1a;--text2:#888;--border:#eee;--bg:#f5f5f5;--card:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow:hidden}
.app{display:flex;height:100vh}
/* Sidebar */
.sidebar{width:72px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;gap:4px}
.nav-item.active{background:var(--primary-bg);border-left-color:var(--primary)}
.nav-item .icon{font-size:22px}
.nav-item .label{font-size:10px;color:var(--text2);white-space:nowrap}
.nav-item.active .label{color:var(--primary);font-weight:600}
/* Content */
.content{flex:1;overflow-y:auto;padding:16px 14px;max-width:640px;margin:0 auto;width:100%}
.date-bar{font-size:13px;color:var(--text2);margin-bottom:14px;text-align:center}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.badge{background:var(--primary-bg);color:var(--primary);font-size:12px;padding:2px 10px;border-radius:10px;font-weight:600}
/* Weekly goal */
.weekly-goal{background:var(--primary-bg);border-radius:8px;padding:12px;margin-bottom:14px}
.weekly-goal label{font-size:13px;font-weight:600;color:var(--primary);display:block;margin-bottom:6px}
.weekly-goal textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px;resize:vertical;min-height:50px;background:#fff;font-family:inherit}
/* Checkbox item */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.check-item:last-child{border-bottom:none}
.checkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.checkbox.checked{background:var(--success);border-color:var(--success);color:#fff}
.checkbox.checked::after{content:'✓';font-size:16px;font-weight:700}
.check-label{flex:1;font-size:15px}
.check-label.done{text-decoration:line-through;color:var(--text2)}
.check-del{color:var(--danger);cursor:pointer;font-size:16px;padding:4px;opacity:.4}
.check-del:active{opacity:1}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit}
.add-row input:focus{outline:none;border-color:var(--primary)}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-sm{padding:6px 12px;font-size:13px}
/* Progress bar */
.progress-info{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}
.progress-info .big{font-size:18px;font-weight:700;color:var(--primary)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
/* English */
.en-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.en-item:last-child{border-bottom:none}
.en-info{flex:1}
.en-name{font-size:15px;font-weight:500}
.en-name.done{text-decoration:line-through;color:var(--text2)}
.en-count-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.en-count-row input{width:60px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}
.movie-list{margin-top:6px}
.movie-entry{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.movie-entry input{padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}
.add-task-btn{border:1px dashed var(--border);border-radius:6px;text-align:center;padding:10px;cursor:pointer;color:var(--text2);margin-top:8px}
.add-task-btn:active{background:var(--primary-bg);color:var(--primary)}
.progress-info-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.progress-info-row .val{font-weight:600}
/* Novel */
.novel-stats{display:flex;gap:8px;margin-bottom:12px}
/* Guide notes history */
.note-history{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.note-history summary{padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--bg);display:flex;align-items:center;list-style:none}
.note-history summary::-webkit-details-marker{display:none}
.note-history summary::before{content:'▸';margin-right:8px;color:var(--text2);transition:transform .2s}
.note-history[open] summary::before{transform:rotate(90deg)}
.note-body{padding:10px 12px;font-size:14px;word-break:break-word;line-height:1.7;color:var(--text)}
/* Interactive sentences & words */
.snt{position:relative;padding:3px 30px 3px 4px;border-radius:6px;transition:background .2s;cursor:pointer}
.snt.active{background:var(--primary-bg)}
.snt-rep{position:absolute;right:2px;top:4px;font-size:12px;opacity:.3;cursor:pointer;padding:3px 5px;border-radius:4px;user-select:none}
.snt-rep:active{opacity:1}
.snt-rep.on{opacity:1;background:var(--warn);border-radius:4px}
.w{border-bottom:1px dashed #a8c8ee;cursor:pointer}
.w:active{color:var(--primary)}
/* Word dictionary popup */
.wdic-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:998;display:none}
.wdic{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);z-index:999;padding:14px 16px 24px;transform:translateY(110%);transition:transform .25s;max-width:640px;margin:0 auto;max-height:70vh;overflow-y:auto}
.wdic.show{transform:translateY(0)}
.wdic-head{display:flex;align-items:center;gap:10px}
.wdic-word{font-size:20px;font-weight:700;color:var(--primary)}
.wdic-btn{border:none;background:var(--primary-bg);color:var(--primary);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.wdic-close{margin-left:auto;background:var(--border);color:var(--text)}
.wdic-phon{color:var(--text2);font-size:14px;margin-top:4px}
.wdic-zh{background:var(--primary-bg);border-radius:6px;padding:6px 10px;margin-top:8px;font-size:15px;font-weight:600;color:var(--primary)}
.wdic-defs{margin-top:8px;font-size:14px;line-height:1.7}
.wdic-def{padding:4px 0;border-bottom:1px dashed var(--border)}
.wdic-def:last-child{border-bottom:none}
.wdic-pos{font-style:italic;color:var(--primary);font-weight:600;margin-right:4px}
/* TTS bar */
.tts-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tts-current{margin-top:8px;padding:10px 12px;background:var(--primary-bg);border-radius:8px;font-size:15px;line-height:1.7;display:none;color:var(--text);font-weight:500}
.note-tts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px 2px;border-top:1px dashed var(--border)}
.nt-current{margin:8px 12px 12px;padding:10px 12px;background:var(--primary-bg);border-radius:8px;font-size:15px;line-height:1.7;display:none;color:var(--text);font-weight:500}
.stat-box{flex:1;background:var(--card);border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-box .num{font-size:22px;font-weight:700}
.stat-box .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.section-gap{height:8px}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:14px}
/* Summary tabs */
.sum-tabs{display:flex;gap:8px;margin-bottom:14px}
.sum-tab{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;border:1px solid var(--border)}
.sum-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:active{background:var(--primary-bg)}
.cal-title{font-size:16px;font-weight:700}
.cal-jump{display:flex;gap:6px}
.cal-jump-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.cal-jump-btn:active{background:var(--primary-bg);color:var(--primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dow{text-align:center;font-size:12px;color:var(--text2);padding:4px 0;font-weight:600}
.cal-day{text-align:center;padding:8px 0;border-radius:6px;font-size:14px;cursor:pointer;position:relative;transition:all .15s;min-height:36px}
.cal-day.other{color:var(--text2);opacity:.35}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700}
.cal-day.selected{background:var(--primary-bg);color:var(--primary);font-weight:700;border:2px solid var(--primary)}
.cal-day.has-data::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--success)}
.cal-day.today.has-data::after{background:#fff}
.cal-day:active{transform:scale(.95)}
.cal-day-info{background:var(--primary-bg);border-radius:8px;padding:14px;margin-top:12px;font-size:13px;line-height:1.8}
.cal-day-info .ci-title{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--primary)}
.cal-day-info .ci-row{display:flex;justify-content:space-between;padding:3px 0}
.cal-day-info .ci-row .v{font-weight:600}
.cal-day-info .ci-done{color:var(--success);font-weight:600}
/* Summary stats */
.sum-stat{background:var(--primary-bg);border-radius:8px;padding:14px;margin-bottom:12px;font-size:13px;line-height:2}
.sum-stat .ss-title{font-weight:700;font-size:15px;margin-bottom:6px;color:var(--primary)}
.sum-stat .ss-row{display:flex;justify-content:space-between;padding:2px 0}
.sum-stat .ss-row .v{font-weight:600}
.sum-stat .ss-row .v.green{color:var(--success)}
.sum-stat .ss-row .v.red{color:var(--danger)}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>
<div class="toast" id="toast"></div>
<div class="wdic-mask" id="wdic-mask"></div>
<div class="wdic" id="wdic">
  <div class="wdic-head"><span class="wdic-word" id="wdic-word"></span><button class="wdic-btn" id="wdic-say">🔊 发音</button><button class="wdic-btn wdic-close" id="wdic-close">✕</button></div>
  <div class="wdic-phon" id="wdic-phon"></div>
  <div class="wdic-defs" id="wdic-defs"></div>
</div>
<script>
// ===== DATA =====
var D={};
var STORE_KEY='daily_app_v4';
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(D))}
function loadData(){
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){D=JSON.parse(raw)}else{D={}}}catch(e){D={}}
  if(!D.exercise)D.exercise={weekly:{},daily:{},weights:{}};
  if(!D.exercise.weekly)D.exercise.weekly={};
  if(!D.exercise.daily)D.exercise.daily={};
  if(!D.exercise.weights)D.exercise.weights={};
  if(!D.english)D.english={};
  if(!D.guide)D.guide={weeklyGoal:{},daily:{}};
  if(!D.guide.weeklyGoal)D.guide.weeklyGoal={};
  if(!D.guide.daily)D.guide.daily={};
}
// ===== UTILS =====
var WEEKDAYS=['日','一','二','三','四','五','六'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekKey(d){d=d||new Date();var day=d.getDay()||7;d=new Date(d);d.setDate(d.getDate()-day+1);return dateKey(d)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(){var d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEKDAYS[d.getDay()]}
function fmtWeekRange(wk){var monday=new Date(wk);var sun=new Date(wk);sun.setDate(sun.getDate()+6);return (monday.getMonth()+1)+'/'+monday.getDate()+' ~ '+(sun.getMonth()+1)+'/'+sun.getDate()}
var _timers={};
function debounce(fn,key,ms){ms=ms||500;if(_timers[key])clearTimeout(_timers[key]);_timers[key]=setTimeout(fn,ms)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}
// ===== NAV =====
var NAV=[
  {id:'exercise',icon:'💪',label:'锻炼'},
  {id:'english',icon:'📖',label:'学英语'},
  {id:'guide',icon:'🎫',label:'英导'},
  {id:'summary',icon:'📊',label:'汇总'},
];
var currentPage='exercise';
function renderSidebar(){
  var html='';
  NAV.forEach(function(n){
    html+='<div class="nav-item'+(currentPage===n.id?' active':'')+'" data-page="'+n.id+'"><div class="icon">'+n.icon+'</div><div class="label">'+n.label+'</div></div>';
  });
  document.getElementById('sidebar').innerHTML=html;
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click',function(){
      currentPage=el.dataset.page;
      renderSidebar();renderPage();
    });
  });
}
function renderPage(){
  var c=document.getElementById('content');
  var html='<div class="date-bar">'+fmtDate()+'</div>';
  if(currentPage==='exercise')html+=renderExercise();
  else if(currentPage==='english')html+=renderEnglish();
  else if(currentPage==='guide')html+=renderGuide();
  else if(currentPage==='summary')html+=renderSummary();
  c.innerHTML=html;
  if(currentPage==='exercise')initExercise();
  else if(currentPage==='english')initEnglish();
  else if(currentPage==='guide')initGuide();
  else if(currentPage==='summary')initSummary();
}
// ===== ENSURE FUNCTIONS =====
function ensureExerciseDaily(dk){
  if(!D.exercise.daily[dk]){
    D.exercise.daily[dk]=[
      {id:uid(),label:'力量训练30分钟',done:false},
      {id:uid(),label:'有氧训练30分钟',done:false}
    ];
    save();
  }
  return D.exercise.daily[dk];
}
function ensureEnglish(dk){
  if(!D.english[dk])D.english[dk]={};
  if(!D.english[dk].nc2)D.english[dk].nc2={done:false,count:0};
  if(!D.english[dk].vocab)D.english[dk].vocab={done:false,count:0};
  if(!D.english[dk].movie)D.english[dk].movie={done:false,movies:[]};
  if(!D.english[dk].movie.movies)D.english[dk].movie.movies=[];
  return D.english[dk];
}
function ensureGuideDaily(dk){
  if(!D.guide.daily[dk])D.guide.daily[dk]={videos:0,questions:0,notes:''};
  if(D.guide.daily[dk].notes===undefined)D.guide.daily[dk].notes='';
  return D.guide.daily[dk];
}
// ===================== PAGE: EXERCISE =====================
function renderExercise(){
  var dk=dateKey();var wk=weekKey();
  var items=ensureExerciseDaily(dk);
  var done=items.filter(function(i){return i.done}).length;
  var html='<div class="weekly-goal"><label>🎯 本周锻炼目标</label>';
  html+='<textarea id="ex-weekly" placeholder="例：本周锻炼5天，力量3次，有氧3次">'+esc(D.exercise.weekly[wk]||'')+'</textarea>';
  html+='<div style="font-size:12px;color:var(--text2);margin-top:4px">'+fmtWeekRange(wk)+'</div></div>';
  html+='<div class="card"><div class="card-title">今日锻炼 <span class="badge">'+done+'/'+items.length+'</span></div>';
  items.forEach(function(item){
    html+='<div class="check-item" data-id="'+item.id+'"><div class="checkbox'+(item.done?' checked':'')+'" data-action="toggle"></div><span class="check-label'+(item.done?' done':'')+'">'+esc(item.label)+'</span><span class="check-del" data-action="del">✕</span></div>';
  });
  html+='<div class="add-row"><input type="text" id="ex-add-input" placeholder="添加锻炼项目..." maxlength="30"><button class="btn btn-primary btn-sm" id="ex-add-btn">添加</button></div>';
  html+='</div>';
  // Weight card
  var todayWeight=D.exercise.weights[dk];
  html+='<div class="card"><div class="card-title">⚖️ 今日体重 <span class="badge">'+(todayWeight?todayWeight+' 斤':'未记录')+'</span></div>';
  html+='<div style="display:flex;gap:8px;align-items:center"><input type="number" id="ex-weight" placeholder="输入今日体重" value="'+(todayWeight||'')+'" step="0.1" min="0" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:16px;font-family:inherit" /><span style="color:var(--text2);font-size:13px;flex-shrink:0">斤</span><button class="btn btn-primary" id="ex-weight-btn">保存</button></div></div>';
  // Weekly stats
  var weekDone=0,weekTotal=0,weekWeights=[];
  var monday=new Date(wk);
  for(var i=0;i<7;i++){
    var d=new Date(monday);d.setDate(d.getDate()+i);
    var dk2=dateKey(d);
    if(D.exercise.daily[dk2]){
      D.exercise.daily[dk2].forEach(function(it){weekTotal++;if(it.done)weekDone++});
    }
    if(D.exercise.weights[dk2])weekWeights.push({d:(d.getMonth()+1)+'/'+d.getDate(),w:D.exercise.weights[dk2]});
  }
  html+='<div class="card"><div class="card-title">本周统计</div>';
  html+='<div class="progress-info-row"><span>本周完成</span><span class="val">'+weekDone+'/'+weekTotal+'</span></div>';
  if(weekWeights.length>0){
    var wFirst=weekWeights[0].w,wLast=weekWeights[weekWeights.length-1].w;
    var wChange=(wLast-wFirst).toFixed(1);
    var changeStr=wChange>0?'+'+wChange+'斤':(wChange<0?wChange+'斤':'持平');
    html+='<div class="progress-info-row"><span>⚖️ 体重记录</span><span class="val">'+weekWeights.map(function(x){return x.d+' '+x.w+'斤'}).join('，')+'</span></div>';
    if(weekWeights.length>1)html+='<div class="progress-info-row"><span>⚖️ 体重变化</span><span class="val" style="color:'+(wChange<0?'var(--success)':(wChange>0?'var(--danger)':'var(--text2)'))+'">'+changeStr+'</span></div>';
  }
  html+='</div>';
  return html;
}
function initExercise(){
  var dk=dateKey();var wk=weekKey();
  var items=D.exercise.daily[dk];
  // Toggle checkboxes
  document.querySelectorAll('.check-item').forEach(function(el){
    var id=el.dataset.id;var item=items.find(function(i){return i.id===id});if(!item)return;
    el.querySelector('[data-action=toggle]').addEventListener('click',function(){
      item.done=!item.done;save();renderPage();toast(item.done?'打卡成功':'取消打卡');
    });
    el.querySelector('[data-action=del]').addEventListener('click',function(){
      D.exercise.daily[dk]=items.filter(function(i){return i.id!==id});save();renderPage();toast('已删除');
    });
  });
  // Add item
  var addInput=document.getElementById('ex-add-input');
  var addBtn=document.getElementById('ex-add-btn');
  function addItem(){var v=addInput.value.trim();if(!v)return;items.push({id:uid(),label:v,done:false});save();renderPage();toast('已添加')}
  addBtn.addEventListener('click',addItem);
  addInput.addEventListener('keydown',function(e){if(e.key==='Enter')addItem()});
  // Weight save
  var wInput=document.getElementById('ex-weight');
  var wBtn=document.getElementById('ex-weight-btn');
  function saveWeight(){var v=parseFloat(wInput.value);if(!v||v<=0){toast('请输入有效体重');return}D.exercise.weights[dk]=v;save();renderPage();toast('体重已记录')}
  wBtn.addEventListener('click',saveWeight);
  wInput.addEventListener('keydown',function(e){if(e.key==='Enter')saveWeight()});
  // Weekly goal
  var wg=document.getElementById('ex-weekly');
  wg.addEventListener('input',function(){D.exercise.weekly[wk]=wg.value;debounce(function(){save();toast('已保存')},'ex_wg')});
}
// ===================== PAGE: ENGLISH =====================
function renderEnglish(){
  var dk=dateKey();var en=ensureEnglish(dk);var done=0;
  if(en.nc2.done)done++;
  if(en.vocab.done)done++;

var guideRate=0.9; // shared TTS rate across note entries
var uttTok=0; // utterance token: invalidate stale onend callbacks

try{guideDict=JSON.parse(localStorage.getItem('guide_dict_v1')||'{}')||{}}catch(e){guideDict={}}
function saveDict(){try{localStorage.setItem('guide_dict_v1',JSON.stringify(guideDict))}catch(e){}}
function splitSentences(t){
  var out=[];
  String(t||'').replace(/\r/g,'').split(/\n+/).forEach(function(p){
    p=p.trim();if(!p)return;
    var s=p.match(/[^.!?\u3002\uff01\uff1f]+[.!?\u3002\uff01\uff1f]*/g);
    if(s)s.forEach(function(x){x=x.trim();if(x)out.push(x)});
  });
  return out;
}
function pickVoice(){
  var vs=speechSynthesis.getVoices();
  var i;
  for(i=0;i<vs.length;i++){if(/^en[-_]/i.test(vs[i].lang)&&/google|natural|samantha|daniel|aria|jenny|zira|male/i.test(vs[i].name))return vs[i]}
  for(i=0;i<vs.length;i++){if(/^en[-_]/i.test(vs[i].lang))return vs[i]}
  return null;
}
function speakWord(w,rate){
  if(!('speechSynthesis' in window))return;
  uttTok++;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(w);
  u.lang='en-US';var v=pickVoice();if(v)u.voice=v;
  u.rate=rate||0.85;
  speechSynthesis.speak(u);
}
function renderWordsHtml(s){
  var out='';var re=/([A-Za-z][A-Za-z'\u2019-]*)|([^A-Za-z]+)/g;var m;
  while((m=re.exec(s))!==null){
    if(m[1])out+='<span class="w" data-w="'+esc(m[1])+'">'+esc(m[1])+'</span>';
    else out+=esc(m[2]);
  }
  return out;
}
function renderSentencesHtml(text){

}

var wdicCur=null;
function showDic(w){

function renderDic(w,e){
  if(wdicCur!==w)return;
  document.getElementById('wdic-phon').textContent=e.phon||'';
  var html='';
  if(e.zh)html+='<div class="wdic-zh">🇨🇳 '+esc(e.zh)+'</div>';
  if(e.defs&&e.defs.length){
    e.defs.forEach(function(d){html+='<div class="wdic-def"><span class="wdic-pos">'+esc(d.pos)+'</span>'+esc(d.def)+'</div>'});
  }else if(!e.zh){
    html+='<div style="color:var(--text2);padding:6px 0">未查到详细释义，可点右上 🔊 听发音</div>';
  }
  document.getElementById('wdic-defs').innerHTML=html;
}
function translateWord(w){
  var e=guideDict[w];if(!e||e.zhTried)return;
  e.zhTried=true;saveDict();
  fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|zh-CN').then(function(r){return r.json()}).then(function(js){
    var t=js&&js.responseData&&js.responseData.translatedText;
    if(t&&t.toLowerCase()!==w.toLowerCase()){e.zh=t;saveDict();renderDic(w,e)}
  }).catch(function(){});
}
function lookupWord(w){
  var c=guideDict[w];
  if(c){
    renderDic(w,c);
    if(!c.zh&&!c.zhTried)translateWord(w);
    return;
  }
  renderDic(w,{phon:'',defs:[]});
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w)).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(js){
    var e={phon:'',defs:[]};
    try{
      var e0=js[0];
      if(e0.phonetic)e.phon=e0.phonetic;
      if(!e.phon&&e0.phonetics){for(var i=0;i<e0.phonetics.length;i++){if(e0.phonetics[i].text){e.phon=e0.phonetics[i].text;break}}}
      if(e0.meanings)e0.meanings.forEach(function(m){
        if(m.definitions)m.definitions.slice(0,2).forEach(function(d){if(d.definition)e.defs.push({pos:m.partOfSpeech||'',def:d.definition})});
      });
    }catch(err){}
    e.defs=e.defs.slice(0,4);
    guideDict[w]=e;saveDict();
    renderDic(w,e);
    translateWord(w);
  }).catch(function(){
    guideDict[w]={phon:'',defs:[],zh:null,zhTried:false};saveDict();
    translateWord(w);
  });
}

      u.onend=function(){if(ttsRestart)return;if(st.playing){st.idx++;speakNext()}};
      u.onerror=function(){if(ttsRestart)return;if(st.playing){st.idx++;setTimeout(speakNext,80)}};
      speechSynthesis.speak(u);
    }
    function stopAll(finished){
      if(ttsActive===st)ttsActive=null;
      st.playing=false;st.paused=false;
      speechSynthesis.cancel();
      playBtn.textContent='▶️ 播放';
      if(body)body.querySelectorAll('.snt.active').forEach(function(el){el.classList.remove('active')});
      if(finished)toast('✅ 朗读完毕');
    }
    st.stop=stopAll;
    playBtn.addEventListener('click',function(){
      if(!hasTts)return;
      if(st.playing){
        if(!st.paused){st.paused=true;speechSynthesis.pause();playBtn.textContent='▶️ 继续'}
        else{st.paused=false;speechSynthesis.resume();playBtn.textContent='⏸ 暂停'}
        return;
      }
      if(ttsActive)ttsActive.stop(false);
      stopLoop();
      var txt=getNoteText(bar.dataset.dk);
      if(bar.dataset.dk===dk&&notesArea&&notesArea.value.trim())txt=notesArea.value.trim();
      st.sentences=splitSentences(txt);
      if(st.sentences.length===0){toast('这条笔记没有可朗读的内容');return}
      st.idx=0;st.playing=true;st.paused=false;
      st.rate=parseFloat(rateInput.value)||0.9;
      ttsActive=st;
      playBtn.textContent='⏸ 暂停';
      speakNext();
    });
    stopBtn.addEventListener('click',function(){stopAll(false)});
    rateInput.addEventListener('input',function(){
      var r=Math.round(parseFloat(rateInput.value)*10)/10;
      guideRate=r;
      if(rateVal)rateVal.textContent=r+'x';
      document.querySelectorAll('.nt-rate').forEach(function(o){if(o!==rateInput)o.value=r});
      document.querySelectorAll('.nt-rate-val').forEach(function(o){if(o!==rateVal)o.textContent=r+'x'});
      if(st.playing&&!st.paused){
        st.rate=r;
        ttsRestart=true;
        speechSynthesis.cancel();
        setTimeout(function(){ttsRestart=false;speakNext()},150);
      }else if(loopSt&&loopSt.bar===bar){
        var si=loopSt.si;stopLoop();playSentence(bar,si,true);
      }
    });
    // per-sentence: tap to read once, 🔁 to loop
    if(body){
      body.querySelectorAll('.snt').forEach(function(sEl){
        var si=parseInt(sEl.dataset.si);
        sEl.querySelector('.snt-text').addEventListener('click',function(){playSentence(bar,si,false)});
        sEl.querySelector('.snt-rep').addEventListener('click',function(e){
          e.stopPropagation();
          if(loopSt&&loopSt.bar===bar&&loopSt.si===si){stopLoop()}
          else{playSentence(bar,si,true)}
        });
      });
      // tap any word → pronounce + dictionary popup
      body.querySelectorAll('.w').forEach(function(wEl){
        wEl.addEventListener('click',function(e){e.stopPropagation();onWordClick(wEl.dataset.w)});
      });
    }
  });
  var wg=document.getElementById('guide-weekly');
  wg.addEventListener('input',function(){D.guide.weeklyGoal[wk]=wg.value;debounce(function(){save();toast('已保存')},'guide_wg')});
}
// ===================== PAGE: SUMMARY =====================
var sumView='calendar'; // calendar | monthly | yearly
var calCurrent=new Date(); // current displayed month in calendar
var calSelectedDate=dateKey(); // selected date in calendar
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function fmtDateShort(dk){var p=dk.split('-');return parseInt(p[1])+'/'+parseInt(p[2])}
function dayHasData(dk){
  if(D.exercise&&D.exercise.daily&&D.exercise.daily[dk]&&D.exercise.daily[dk].some(function(i){return i.done}))return true;
  if(D.exercise&&D.exercise.weights&&D.exercise.weights[dk])return true;
  if(D.english&&D.english[dk]){
    var en=D.english[dk];
    if((en.nc2&&(en.nc2.done||(en.nc2.count||0)>0))||(en.vocab&&(en.vocab.count||0)>0)||(en.movie&&(en.movie.done||(en.movie.movies&&en.movie.movies.length>0))))return true;
  }
  if(D.guide&&D.guide.daily&&D.guide.daily[dk]&&(((D.guide.daily[dk].videos||0)>0||(D.guide.daily[dk].questions||0)>0)||((D.guide.daily[dk].notes||'').trim().length>0)))return true;
  return false;
}
function buildDayInfo(dk){
  var rows=[];
  var hasAny=false;
  // Exercise (only done items)
  if(D.exercise&&D.exercise.daily&&D.exercise.daily[dk]){
    var exItems=D.exercise.daily[dk];
    var exDoneItems=exItems.filter(function(i){return i.done});
    if(exDoneItems.length>0){
      hasAny=true;
      rows.push('<div class="ci-row"><span>💪 锻炼完成</span><span class="v ci-done">'+exDoneItems.length+' 项</span></div>');
      exDoneItems.forEach(function(it){rows.push('<div class="ci-row" style="padding-left:12px;font-size:12px;color:var(--text2)"><span>✅ '+esc(it.label)+'</span></div>')});
    }
  }
  if(D.exercise&&D.exercise.weights&&D.exercise.weights[dk]){
    hasAny=true;
    rows.push('<div class="ci-row"><span>⚖️ 今日体重</span><span class="v">'+D.exercise.weights[dk]+' 斤</span></div>');
  }
  // English (only done activities)
  if(D.english&&D.english[dk]){
    var en=D.english[dk];var essays=0;
    if(en.nc2)essays+=(en.nc2.count||0);
    var vocabCount=(en.vocab&&en.vocab.count)||0;
    var movieMin=0;var movieNames=[];
    if(en.movie&&en.movie.movies){en.movie.movies.forEach(function(mv){movieMin+=(mv.minutes||0);if(mv.name)movieNames.push(mv.name)})}
    if(en.nc2&&en.nc2.done){hasAny=true;rows.push('<div class="ci-row"><span>📖 新概念二册</span><span class="v ci-done">'+(essays>0?essays+' 篇':'完成')+'</span></div>')}
    else if(essays>0){hasAny=true;rows.push('<div class="ci-row"><span>📖 新概念二册</span><span class="v">'+essays+' 篇</span></div>')}
    if(vocabCount>0){hasAny=true;rows.push('<div class="ci-row"><span>📕 背单词</span><span class="v'+(vocabCount>=500?' ci-done':'')+'">'+vocabCount+' 个</span></div>')}
    if(en.movie&&en.movie.done){hasAny=true;rows.push('<div class="ci-row"><span>🎬 电影整理</span><span class="v ci-done">'+(movieMin>0?movieMin+' 分钟':'完成')+'</span></div>')}
    else if(movieMin>0){hasAny=true;rows.push('<div class="ci-row"><span>🎬 电影整理</span><span class="v">'+movieMin+' 分钟</span></div>')}
    if(movieNames.length>0)rows.push('<div class="ci-row" style="padding-left:12px;font-size:12px;color:#856404"><span>'+esc(movieNames.join('、'))+'</span></div>');
  }
  // Guide (英导)
  if(D.guide&&D.guide.daily&&D.guide.daily[dk]){
    var gv=D.guide.daily[dk].videos||0;var gq=D.guide.daily[dk].questions||0;
    if(gv>0||gq>0){hasAny=true;rows.push('<div class="ci-row"><span>🎫 英导学习</span><span class="v">'+gv+' 视频 / '+gq+' 题</span></div>')}
    var gn=(D.guide.daily[dk].notes||'').trim();
    if(gn.length>0){
      hasAny=true;
      var gnPreview=gn.length>40?gn.slice(0,40)+'…':gn;
      rows.push('<div class="ci-row" style="flex-direction:column;align-items:flex-start"><span>🎤 导游词笔记（'+gn.length+' 字）</span><span style="font-size:12px;color:var(--text2);margin-top:2px;white-space:pre-wrap;word-break:break-word">'+esc(gnPreview)+'</span></div>');
    }
  }
  if(!hasAny)return '<div class="cal-day-info"><div class="ci-title">'+fmtDateShort(dk)+' 无记录</div><div style="color:var(--text2)">这一天没有数据</div></div>';
  var d=new Date(dk);
  return '<div class="cal-day-info"><div class="ci-title">'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEKDAYS[d.getDay()]+'</div>'+rows.join('')+'</div>';
}
function buildMonthStats(ym){
  var y=parseInt(ym.split('-')[0]);var m=parseInt(ym.split('-')[1]);
  var days=new Date(y,m,0).getDate();
  var activeDays=0,exDone=0,exTotal=0,enDone=0,essays=0,vocabTotal=0,movieMin=0,movieNames=[];
  var guideVideos=0,guideQuestions=0,guideNoteDays=0;
  var weightFirst=null,weightLast=null,weightCount=0;
  for(var d=1;d<=days;d++){
    var dk=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var hasData=false;
    if(D.exercise&&D.exercise.daily&&D.exercise.daily[dk]){D.exercise.daily[dk].forEach(function(it){exTotal++;if(it.done)exDone++;if(it.done)hasData=true})}
    if(D.exercise&&D.exercise.weights&&D.exercise.weights[dk]){var wv=D.exercise.weights[dk];if(weightFirst===null)weightFirst=wv;weightLast=wv;weightCount++;hasData=true}
    if(D.english&&D.english[dk]){
      var en=D.english[dk];
      var dEn=0,dEss=0,dVoc=0;
      if(en.nc2){if(en.nc2.done)dEn++;dEss+=(en.nc2.count||0);essays+=dEss}
      if(en.vocab){var vc=en.vocab.count||0;vocabTotal+=vc;dVoc+=vc}
      if(en.movie&&(en.movie.done||(en.movie.movies&&en.movie.movies.length>0)))dEn++;
      if(en.movie&&en.movie.movies){en.movie.movies.forEach(function(mv){movieMin+=(mv.minutes||0);if(mv.name)movieNames.push(mv.name)})}
      enDone+=dEn;
      if(dEn>0||dEss>0||dVoc>0)hasData=true;
    }
    if(D.guide&&D.guide.daily&&D.guide.daily[dk]){var gv2=D.guide.daily[dk].videos||0;var gq2=D.guide.daily[dk].questions||0;if(gv2>0||gq2>0){guideVideos+=gv2;guideQuestions+=gq2;hasData=true}if(((D.guide.daily[dk].notes||'').trim().length>0)){guideNoteDays++;hasData=true}}
    if(hasData)activeDays++;
  }
  var rows=[];
  rows.push('<div class="ss-title">'+y+'年'+m+'月 数据汇总</div>');
  rows.push('<div class="ss-row"><span>活跃天数</span><span class="v">'+activeDays+'/'+days+' 天</span></div>');
  if(exDone>0)rows.push('<div class="ss-row"><span>💪 锻炼完成</span><span class="v">'+exDone+' 项</span></div>');
  if(weightCount>0)rows.push('<div class="ss-row"><span>⚖️ 体重记录</span><span class="v">'+weightFirst+' → '+weightLast+' 斤（'+weightCount+' 次）</span></div>');
  if(enDone>0)rows.push('<div class="ss-row"><span>📖 英语打卡</span><span class="v">'+enDone+' 次</span></div>');
  if(essays>0)rows.push('<div class="ss-row"><span>📖 背诵总篇数</span><span class="v">'+essays+' 篇</span></div>');
  if(vocabTotal>0)rows.push('<div class="ss-row"><span>📕 背单词总数</span><span class="v">'+vocabTotal.toLocaleString()+' 个</span></div>');
  if(movieMin>0)rows.push('<div class="ss-row"><span>🎬 电影整理</span><span class="v">'+movieMin+' 分钟</span></div>');
  if(movieNames.length>0)rows.push('<div class="ss-row" style="flex-direction:column;align-items:flex-start"><span>🎬 看过的电影</span><span style="font-size:12px;color:#856404;margin-top:2px">'+esc(movieNames.join('、'))+'</span></div>');
  if(guideVideos>0||guideQuestions>0)rows.push('<div class="ss-row"><span>🎫 英导学习</span><span class="v">'+guideVideos+' 视频 / '+guideQuestions+' 题</span></div>');
  if(guideNoteDays>0)rows.push('<div class="ss-row"><span>🎤 导游词笔记</span><span class="v">'+guideNoteDays+' 天</span></div>');
  if(activeDays===0)rows.push('<div style="color:var(--text2);text-align:center;padding:10px">本月暂无数据</div>');
  return '<div class="sum-stat">'+rows.join('')+'</div>';
}
function buildYearStats(y){
  var activeMonths=0,activeDays=0;
  var totalExDone=0,totalExTotal=0,totalEnDone=0,totalEssays=0,totalVocab=0,totalMovieMin=0;
  var totalGuideVideos=0,totalGuideQuestions=0,totalGuideNoteDays=0;
  var weightFirst=null,weightLast=null,weightCount=0;
  var allMovies=[];
  for(var m=1;m<=12;m++){
    var ym=y+'-'+String(m).padStart(2,'0');
    var days=new Date(y,m,0).getDate();var monthActive=false;var monthDays=0;
    for(var d=1;d<=days;d++){
      var dk=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var hasData=false;
      if(D.exercise&&D.exercise.daily&&D.exercise.daily[dk]){D.exercise.daily[dk].forEach(function(it){totalExTotal++;if(it.done)totalExDone++;if(it.done)hasData=true})}
      if(D.exercise&&D.exercise.weights&&D.exercise.weights[dk]){var wv2=D.exercise.weights[dk];if(weightFirst===null)weightFirst=wv2;weightLast=wv2;weightCount++;hasData=true}
      if(D.english&&D.english[dk]){
        var en=D.english[dk];
        if(en.nc2){if(en.nc2.done)totalEnDone++;totalEssays+=(en.nc2.count||0)}
        if(en.vocab)totalVocab+=(en.vocab.count||0);
        if(en.movie&&(en.movie.done||(en.movie.movies&&en.movie.movies.length>0)))totalEnDone++;
        if(en.movie&&en.movie.movies){en.movie.movies.forEach(function(mv){totalMovieMin+=(mv.minutes||0);if(mv.name)allMovies.push(mv.name)})}
        hasData=true;
      }
      if(D.guide&&D.guide.daily&&D.guide.daily[dk]){var gv3=D.guide.daily[dk].videos||0;var gq3=D.guide.daily[dk].questions||0;if(gv3>0||gq3>0){totalGuideVideos+=gv3;totalGuideQuestions+=gq3;hasData=true}if(((D.guide.daily[dk].notes||'').trim().length>0)){totalGuideNoteDays++;hasData=true}}
      if(hasData){monthDays++;activeDays++}
    }
    if(monthDays>0){activeMonths++}
  }
  var rows=[];
  rows.push('<div class="ss-title">'+y+'年 年度数据汇总</div>');
  rows.push('<div class="ss-row"><span>活跃月份</span><span class="v">'+activeMonths+'/12</span></div>');
  rows.push('<div class="ss-row"><span>活跃天数</span><span class="v">'+activeDays+' 天</span></div>');
  if(totalExDone>0)rows.push('<div class="ss-row"><span>💪 锻炼完成</span><span class="v">'+totalExDone+' 项</span></div>');
  if(weightCount>0)rows.push('<div class="ss-row"><span>⚖️ 体重变化</span><span class="v">'+weightFirst+' → '+weightLast+' 斤（'+weightCount+' 次记录）</span></div>');
  if(totalEnDone>0)rows.push('<div class="ss-row"><span>📖 英语打卡</span><span class="v">'+totalEnDone+' 次</span></div>');
  if(totalEssays>0)rows.push('<div class="ss-row"><span>📖 背诵总篇数</span><span class="v">'+totalEssays+' 篇</span></div>');
  if(totalVocab>0)rows.push('<div class="ss-row"><span>📕 背单词总数</span><span class="v">'+totalVocab.toLocaleString()+' 个</span></div>');
  if(totalMovieMin>0)rows.push('<div class="ss-row"><span>🎬 电影整理</span><span class="v">'+totalMovieMin+' 分钟</span></div>');
  if(allMovies.length>0)rows.push('<div class="ss-row" style="flex-direction:column;align-items:flex-start"><span>🎬 整理电影数</span><span style="font-size:12px;color:#856404;margin-top:2px">共 '+allMovies.length+' 部</span></div>');
  if(totalGuideVideos>0||totalGuideQuestions>0)rows.push('<div class="ss-row"><span>🎫 英导学习</span><span class="v">'+totalGuideVideos+' 视频 / '+totalGuideQuestions+' 题</span></div>');
  if(totalGuideNoteDays>0)rows.push('<div class="ss-row"><span>🎤 导游词笔记</span><span class="v">'+totalGuideNoteDays+' 天</span></div>');
  if(activeDays===0)rows.push('<div style="color:var(--text2);text-align:center;padding:10px">本年暂无数据</div>');
  return '<div class="sum-stat">'+rows.join('')+'</div>';
}
function renderSummary(){
  var html='<div class="sum-tabs">';
  html+='<div class="sum-tab'+(sumView==='calendar'?' active':'')+'" data-tab="calendar">📅 日历</div>';
  html+='<div class="sum-tab'+(sumView==='monthly'?' active':'')+'" data-tab="monthly">📊 月报</div>';
  html+='<div class="sum-tab'+(sumView==='yearly'?' active':'')+'" data-tab="yearly">📋 年报</div>';
  html+='</div>';
  if(sumView==='calendar'){
    html+=renderCalendar();
  }else if(sumView==='monthly'){
    html+=renderMonthlyView();
  }else if(sumView==='yearly'){
    html+=renderYearlyView();
  }
  return html;
}
function renderCalendar(){
  var y=calCurrent.getFullYear();var m=calCurrent.getMonth();
  var todayDk=dateKey();
  var firstDay=new Date(y,m,1);var startDow=firstDay.getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var html='<div class="cal-header"><div class="cal-nav">';
  html+='<button class="cal-nav-btn" data-action="calprev">◀</button>';
  html+='<span class="cal-title">'+y+'年'+(m+1)+'月</span>';
  html+='<button class="cal-nav-btn" data-action="calnext">▶</button>';
  html+='</div><div class="cal-jump">';
  html+='<button class="cal-jump-btn" data-action="jumpmonth">月报</button>';
  html+='<button class="cal-jump-btn" data-action="jumpyear">年报</button>';
  html+='</div></div>';
  html+='<div class="cal-grid">';
  for(var i=0;i<7;i++)html+='<div class="cal-dow">'+WEEKDAYS[i]+'</div>';
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=dk===todayDk;
    var isSelected=dk===calSelectedDate&&!isToday;
    var hasData=dayHasData(dk);
    var cls='cal-day';if(isToday)cls+=' today';if(hasData)cls+=' has-data';if(isSelected)cls+=' selected';
    html+='<div class="'+cls+'" data-dk="'+dk+'">'+d+'</div>';
  }
  html+='</div>';
  html+=buildDayInfo(calSelectedDate);
  return html;
}
function renderMonthlyView(){
  var y=calCurrent.getFullYear();var m=calCurrent.getMonth();
  var html='<div class="cal-header"><div class="cal-nav">';
  html+='<button class="cal-nav-btn" data-action="mprev">◀</button>';
  html+='<span class="cal-title">'+y+'年'+(m+1)+'月</span>';
  html+='<button class="cal-nav-btn" data-action="mnext">▶</button>';
  html+='</div><div class="cal-jump">';
  html+='<button class="cal-jump-btn" data-action="jumpcal">日历</button>';
  html+='<button class="cal-jump-btn" data-action="jumpyear">年报</button>';
  html+='</div></div>';
  html+=buildMonthStats(y+'-'+String(m+1).padStart(2,'0'));
  return html;
}
function renderYearlyView(){
  var y=calCurrent.getFullYear();
  var html='<div class="cal-header"><div class="cal-nav">';
  html+='<button class="cal-nav-btn" data-action="yprev">◀</button>';
  html+='<span class="cal-title">'+y+'年</span>';
  html+='<button class="cal-nav-btn" data-action="ynext">▶</button>';
  html+='</div><div class="cal-jump">';
  html+='<button class="cal-jump-btn" data-action="jumpcal">日历</button>';
  html+='<button class="cal-jump-btn" data-action="jumpmonth">月报</button>';
  html+='</div></div>';
  html+=buildYearStats(y);
  return html;
}
function initSummary(){
  // Tab switching
  document.querySelectorAll('.sum-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      sumView=tab.dataset.tab;renderPage();
    });
  });
  // Calendar navigation
  document.querySelectorAll('[data-action=calprev]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setMonth(calCurrent.getMonth()-1);renderPage()})});
  document.querySelectorAll('[data-action=calnext]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setMonth(calCurrent.getMonth()+1);renderPage()})});
  document.querySelectorAll('[data-action=mprev]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setMonth(calCurrent.getMonth()-1);renderPage()})});
  document.querySelectorAll('[data-action=mnext]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setMonth(calCurrent.getMonth()+1);renderPage()})});
  document.querySelectorAll('[data-action=yprev]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setFullYear(calCurrent.getFullYear()-1);renderPage()})});
  document.querySelectorAll('[data-action=ynext]').forEach(function(b){b.addEventListener('click',function(){calCurrent.setFullYear(calCurrent.getFullYear()+1);renderPage()})});
  // Jump buttons
  document.querySelectorAll('[data-action=jumpcal]').forEach(function(b){b.addEventListener('click',function(){sumView='calendar';renderPage()})});
  document.querySelectorAll('[data-action=jumpmonth]').forEach(function(b){b.addEventListener('click',function(){sumView='monthly';renderPage()})});
  document.querySelectorAll('[data-action=jumpyear]').forEach(function(b){b.addEventListener('click',function(){sumView='yearly';renderPage()})});
  // Date click in calendar
  document.querySelectorAll('.cal-day[data-dk]').forEach(function(el){
    el.addEventListener('click',function(){
      calSelectedDate=el.dataset.dk;renderPage();
    });
  });
}
