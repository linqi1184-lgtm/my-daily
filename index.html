<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f2f5;--card:#fff;--primary:#4a90d9;--primary-bg:#e8f1fc;
  --success:#52c41a;--success-bg:#f0fce8;--danger:#ff4d4f;--danger-bg:#fff1f0;
  --text:#1a1a1a;--text2:#888;--border:#eee;--radius:12px;
  --nav-w:72px;--shadow:0 2px 8px rgba(0,0,0,.06);
  --warn:#faad14;--warn-bg:#fffbe6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow-x:hidden}

/* ===== Sidebar ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;padding-top:4px;overflow-y:auto}
.sidebar-footer{margin-top:auto;padding:8px 0 6px;border-top:1px solid var(--border)}
.download-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;color:var(--warn);cursor:pointer;font-size:9px;letter-spacing:.3px}
.download-btn .icon{font-size:18px}
.download-btn:active{background:var(--warn-bg)}
.nav-item{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .2s;color:var(--text2);position:relative;padding:4px 2px}
.nav-item .icon{font-size:20px}
.nav-item .label{font-size:9px;letter-spacing:.3px}
.nav-item.active{color:var(--primary);background:var(--primary-bg)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--primary);border-radius:0 3px 3px 0}

/* ===== Content ===== */
.content{margin-left:var(--nav-w);min-height:100vh;padding:16px 14px 40px}
.page{display:none;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:16px}
.page-header .date{font-size:13px;color:var(--text2)}
.page-header h2{font-size:20px;font-weight:700;margin-top:2px}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* ===== Checkboxes ===== */
.task-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.checkbox{width:24px;height:24px;border:2px solid #ddd;border-radius:6px;flex-shrink:0;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.checkbox.checked{background:var(--success);border-color:var(--success)}
.checkbox.checked::after{content:'';width:7px;height:12px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.task-text{flex:1;font-size:15px;transition:all .2s}
.task-text.done{text-decoration:line-through;color:var(--text2)}
.task-del{color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;opacity:.6}
.task-del:active{opacity:1}

/* ===== Inputs & Buttons ===== */
.input-row{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:15px;font-family:inherit;background:#fafafa;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);background:#fff}
textarea{resize:vertical;min-height:80px}
select{appearance:auto;padding:11px 14px}
.btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{transform:scale(.97)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-danger-sm{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:7px 14px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit}

/* ===== Progress ===== */
.progress-bar{width:100%;height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#69b7e8);border-radius:5px;transition:width .4s ease}
.progress-info{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text2)}
.progress-info .big{font-size:22px;font-weight:700;color:var(--text)}

/* ===== Exercise ===== */
.period-label{font-size:13px;font-weight:600;color:var(--primary);margin:4px 0 2px;padding-left:4px}
.ex-item{display:flex;align-items:center;gap:10px;padding:12px;background:#fafafa;border-radius:8px;margin-bottom:8px;flex-wrap:wrap}
.ex-item .time{font-size:12px;color:var(--text2);min-width:85px}
.ex-item .type{font-size:14px;font-weight:500}
.ex-item .dur{font-size:12px;color:var(--text2)}
.ex-detail-row{width:100%;margin-top:6px}
.ex-detail-row input{font-size:13px;padding:8px 10px;border-radius:6px}

/* ===== English ===== */
.en-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.en-item:last-child{border-bottom:none}
.en-info{flex:1}
.en-name{font-size:15px;font-weight:500}
.en-name.done{text-decoration:line-through;color:var(--text2)}
.en-count-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.en-count-row input{width:70px;padding:6px 10px;font-size:14px}
.en-count-row .unit{font-size:12px;color:var(--text2)}
.movie-name-tag{display:inline-block;background:#fff3cd;color:#856404;font-size:11px;padding:2px 8px;border-radius:8px;margin-left:6px;font-weight:600}

/* ===== Novel ===== */
.novel-toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.novel-toolbar button{border:1px solid var(--border);background:#fafafa;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.novel-toolbar button:active{background:var(--primary-bg)}
.novel-editor{width:100%;min-height:300px;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:15px;line-height:1.8;outline:none;background:#fafafa}
.novel-editor:focus{border-color:var(--primary);background:#fff}
.novel-editor:empty::before{content:attr(data-placeholder);color:var(--text2);pointer-events:none}
.novel-stats{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.stat-box{flex:1;min-width:80px;background:#fafafa;border-radius:8px;padding:12px;text-align:center}
.stat-box .num{font-size:24px;font-weight:700}
.stat-box .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.speed-box{background:#fff3cd;border-radius:8px;padding:12px;text-align:center;min-width:80px;flex:1}
.speed-box .num{font-size:24px;font-weight:700;color:#856404}
.speed-box .lbl{font-size:12px;color:#856404;margin-top:2px}

/* ===== Work ===== */
.work-cat{background:#fafafa;border-radius:10px;padding:14px;margin-bottom:12px}
.work-cat-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.work-cat-header .cat-name{flex:1;font-size:15px;font-weight:600;cursor:pointer}
.work-cat-header .cat-name:hover{color:var(--primary)}
.work-cat-header .cat-del{color:var(--danger);font-size:13px;cursor:pointer;padding:4px 8px}
.subtask{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0}
.subtask:last-child{border-bottom:none}
.subtask .checkbox{width:20px;height:20px}
.subtask .st-text{flex:1;font-size:14px}
.subtask .st-text.done{text-decoration:line-through;color:var(--text2)}
.subtask .st-del{color:var(--danger);font-size:16px;cursor:pointer;padding:2px 6px;opacity:.5}
.sub-add-row{display:flex;gap:6px;margin-top:8px}
.sub-add-row input{padding:8px 10px;font-size:13px}
.work-add-row{display:flex;gap:8px;margin-top:14px}
.work-add-row input{padding:11px 14px;font-size:15px}
.cat-edit-input{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--primary);border-radius:6px;background:#fff;outline:none}

/* ===== Budget ===== */
.budget-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.budget-box{flex:1;min-width:100px;background:#fafafa;border-radius:8px;padding:12px;text-align:center}
.budget-box .num{font-size:22px;font-weight:700}
.budget-box .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.budget-box.inc .num{color:var(--success)}
.budget-box.exp .num{color:var(--danger)}
.budget-box.bal .num{color:var(--primary)}
.entry-form{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.entry-form select{width:auto;min-width:80px;padding:8px 10px;font-size:13px}
.entry-form input{width:auto;min-width:80px;padding:8px 10px;font-size:13px}
.mood-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mood-btn{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;transition:background .2s}
.mood-btn.sel{background:var(--primary-bg)}
.entry-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.entry-item:last-child{border-bottom:none}
.entry-type{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.entry-type.inc{background:var(--success-bg);color:var(--success)}
.entry-type.exp{background:var(--danger-bg);color:var(--danger)}
.entry-amount{font-weight:600;min-width:60px}
.entry-cat{color:var(--text2);font-size:13px}
.entry-mood{font-size:16px}
.entry-note{color:var(--text2);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-del{color:var(--danger);cursor:pointer;font-size:16px;opacity:.5;padding:2px 6px}

/* ===== Travel ===== */
.travel-card{background:#fafafa;border-radius:10px;padding:14px;margin-bottom:12px}
.travel-card img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin:8px 0}
.travel-card .t-name{font-size:16px;font-weight:700}
.travel-card .t-location{font-size:13px;color:var(--text2);margin-top:2px}
.travel-card .t-desc{font-size:14px;margin-top:6px;line-height:1.7}
.travel-card-header{display:flex;align-items:center;gap:8px}
.travel-card-header .t-del{color:var(--danger);font-size:13px;cursor:pointer;padding:4px 8px}
.travel-img-upload{position:relative;overflow:hidden;display:inline-block}
.travel-img-upload input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
.travel-img-upload .upload-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;background:var(--primary-bg);color:var(--primary);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

/* ===== Planning ===== */
.plan-period{background:#fafafa;border-radius:10px;padding:14px;margin-bottom:12px}
.plan-period .period-name{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.plan-period .period-name .done-badge{font-size:11px;background:var(--success-bg);color:var(--success);padding:1px 6px;border-radius:8px}
.plan-goal{margin-bottom:10px}
.plan-goal textarea{min-height:60px;font-size:14px}

/* ===== Review ===== */
.review-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.review-tab{flex:1;text-align:center;padding:9px 2px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;border:1px solid var(--border)}
.review-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.review-summary{background:var(--primary-bg);border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;line-height:2}
.review-summary .stat-line{display:flex;justify-content:space-between}
.review-summary .stat-line .val{font-weight:600;color:var(--primary)}

/* ===== Calendar ===== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav .cal-title{font-size:16px;font-weight:700}
.cal-nav .cal-arrow{font-size:18px;cursor:pointer;padding:4px 10px;color:var(--primary);font-weight:700;border-radius:6px;transition:background .2s}
.cal-nav .cal-arrow:active{background:var(--primary-bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-weekday{font-size:11px;color:var(--text2);padding:6px 0;font-weight:600}
.cal-day{font-size:13px;padding:7px 2px;border-radius:8px;cursor:pointer;position:relative;transition:all .15s;line-height:1.4}
.cal-day:active{background:var(--primary-bg)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700;border-radius:8px}
.cal-day.has-data::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--success);border-radius:50%}
.cal-day.today.has-data::after{background:#fff}
.cal-day.other-month{color:#ccc;cursor:default}
.cal-day.other-month:active{background:transparent}
.cal-day.selected{background:var(--primary-bg);font-weight:600;border-radius:8px}
.cal-day.selected.today{background:var(--primary);color:#fff}
.cal-day-info{background:var(--card);border-radius:var(--radius);padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.cal-day-info h3{font-size:15px;font-weight:700;margin-bottom:8px}
.cal-summary-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;background:var(--primary-bg);color:var(--primary);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.cal-summary-btn:active{background:var(--primary);color:#fff}

/* ===== Mood Diary ===== */
.mood-emoji-row{display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.mood-emoji{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;border:3px solid var(--border);transition:all .2s;background:#fff}
.mood-emoji.active{border-color:var(--primary);background:var(--primary-bg);transform:scale(1.15)}
.mood-emoji:active{transform:scale(.9)}
.mood-trend{margin-top:14px}
.mood-trend-title{font-size:14px;font-weight:600;margin-bottom:8px}
.mood-trend-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:8px 0}
.mood-bar{flex:1;min-width:0;border-radius:6px 6px 0 0;transition:height .3s;display:flex;align-items:flex-end;justify-content:center;font-size:16px;padding:4px 0}
.mood-bar-date{font-size:10px;color:var(--text2);text-align:center;margin-top:4px}
.mood-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mood-stat-item{background:var(--primary-bg);border-radius:8px;padding:10px;text-align:center;font-size:13px}
.mood-stat-item .num{font-size:20px;font-weight:700;color:var(--primary)}

/* ===== Goal Progress ===== */
.goal-ring-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.goal-ring{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.goal-ring-label{font-size:13px;font-weight:600;margin-bottom:8px}
.goal-ring-svg{width:80px;height:80px;margin:0 auto}
.goal-ring-pct{font-size:14px;font-weight:700;margin-top:4px}
.goal-ring-pct.red{color:var(--danger)}
.goal-ring-pct.yellow{color:var(--warn)}
.goal-ring-pct.green{color:var(--success)}
.goal-total-ring{margin-bottom:14px;text-align:center;background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.goal-total-svg{width:120px;height:120px;margin:0 auto}
.goal-total-label{font-size:16px;font-weight:700;margin-top:8px}

/* ===== Data Export ===== */
.export-section{margin-bottom:14px}
.export-btn{display:flex;align-items:center;gap:8px;padding:14px;background:var(--card);border-radius:var(--radius);cursor:pointer;box-shadow:var(--shadow);transition:all .2s;margin-bottom:8px;width:100%}
.export-btn:active{background:var(--primary-bg)}
.export-btn .export-icon{font-size:24px}
.export-btn .export-info{text-align:left}
.export-btn .export-info .title{font-size:15px;font-weight:600}
.export-btn .export-info .desc{font-size:12px;color:var(--text2)}
.export-btn.danger{border:1px solid var(--danger-bg)}
.import-file-input{display:none}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,0,0,.75);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:9999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Misc ===== */
.movie-entry{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.movie-entry:last-child{border-bottom:none}
.movie-emoji{font-size:16px}
.empty{text-align:center;color:var(--text2);padding:20px 0;font-size:14px}
.add-task-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border:1px dashed #ccc;border-radius:8px;color:var(--text2);cursor:pointer;font-size:14px;margin-top:10px;transition:all .2s}
.add-task-btn:active{border-color:var(--primary);color:var(--primary)}
.badge{display:inline-block;background:var(--success-bg);color:var(--success);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.section-gap{height:8px}

@media(min-width:600px){
  :root{--nav-w:180px}
  .nav-item{flex-direction:row;justify-content:flex-start;padding:0 14px;gap:8px;min-height:44px}
  .nav-item .label{font-size:13px}
  .nav-item .icon{font-size:18px}
  .nav-item.active::before{height:100%;top:0;transform:none;width:3px}
  .content{max-width:680px;margin-left:var(--nav-w);padding:24px}
}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<main class="content" id="content"></main>
<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
const STORAGE_KEY = 'daily_mgr_v3';
const DAILY_GOAL = 10000;

const NAV = [
  {id:'plan',icon:'📋',label:'计划'},
  {id:'exercise',icon:'💪',label:'锻炼'},
  {id:'english',icon:'📖',label:'英语'},
  {id:'novel',icon:'✍️',label:'小说'},
  {id:'work',icon:'💼',label:'工作'},
  {id:'budget',icon:'💰',label:'记账'},
  {id:'travel',icon:'🌍',label:'旅行'},
  {id:'planning',icon:'🎯',label:'规划'},
  {id:'review',icon:'📊',label:'复盘'},
  {id:'mood',icon:'😊',label:'心情'},
  {id:'goal',icon:'📈',label:'目标'},
  {id:'export',icon:'📤',label:'导出'},
];

const DEFAULT_TASKS = [
  {id:'f1',text:'锻炼',done:false,fixed:true},
  {id:'f2',text:'学英语',done:false,fixed:true},
  {id:'f3',text:'写小说',done:false,fixed:true},
  {id:'f4',text:'工作整理',done:false,fixed:true},
];

const EXERCISE = [
  {id:'am_str',period:'上午训练',time:'10:00–10:30',type:'力量训练',dur:'30分钟'},
  {id:'am_car',period:'上午训练',time:'10:30–11:00',type:'有氧训练',dur:'30分钟'},
  {id:'pm_str',period:'晚上训练',time:'19:30–20:00',type:'力量训练',dur:'30分钟'},
  {id:'pm_car',period:'晚上训练',time:'20:00–20:30',type:'有氧训练',dur:'30分钟'},
];

const ENGLISH = [
  {id:'nc1',name:'新概念第一册',hasCount:true},
  {id:'nc2',name:'新概念第二册',hasCount:true},
  {id:'nc3',name:'新概念第三册',hasCount:true},
  {id:'movie',name:'英文电影整理'},
];

const EXPENSE_CATS = ['餐饮','交通','购物','娱乐','住房','医疗','教育','通讯','其他'];
const INCOME_CATS = ['工资','副业','投资','礼金','其他'];
const MOODS = ['😊','😐','😢','😡','🤑','💪','😍','🤔','😰','😎'];
const WEEKDAYS = ['日','一','二','三','四','五','六'];

const PLANNING_PERIODS = [
  {id:'1w',name:'近1周'},
  {id:'1m',name:'1个月'},
  {id:'3m',name:'3个月'},
  {id:'6m',name:'6个月'},
  {id:'1y',name:'1年'},
  {id:'3y',name:'3年'},
  {id:'5y',name:'5年'},
];

// ===================== UTILS =====================
function dateKey(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function weekKey(d){d=d||new Date();var day=d.getDay()||7;d=new Date(d);d.setDate(d.getDate()-day+1);return dateKey(d)}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function yearKey(d){d=d||new Date();return String(d.getFullYear())}
function fmtDate(d){d=d||new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEKDAYS[d.getDay()]}
function fmtDateShort(k){var p=k.split('-');return p[1]+'月'+p[2]+'日'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var debounceTimer={};
function debounce(fn,key,ms){ms=ms||500;clearTimeout(debounceTimer[key]);debounceTimer[key]=setTimeout(fn,ms)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ===================== STORAGE =====================
function loadData(){
  // Migration from v2
  try{
    var v2 = JSON.parse(localStorage.getItem('daily_mgr_v2'));
    if(v2){
      v2.budget = v2.budget || {};
      v2.travel = v2.travel || {destinations:[]};
      v2.planning = v2.planning || {};
      v2.review = v2.review || {daily:{},weekly:{},otherWork:{}};
      if(!v2.review.otherWork) v2.review.otherWork = {};
      localStorage.setItem(STORAGE_KEY,JSON.stringify(v2));
      localStorage.removeItem('daily_mgr_v2');
    }
  }catch(e){}
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return {}}
}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
var D = loadData();
function save(){saveData(D)}

function ensurePlan(date){if(!D.plan)D.plan={};if(!D.plan[date])D.plan[date]=JSON.parse(JSON.stringify(DEFAULT_TASKS));return D.plan[date]}
function ensureExercise(date){if(!D.exercise)D.exercise={};if(!D.exercise[date])D.exercise[date]={items:{},details:{},notes:''};if(!D.exercise[date].details)D.exercise[date].details={};return D.exercise[date]}
function ensureEnglish(date){if(!D.english)D.english={};if(!D.english[date])D.english[date]={nc1:{done:false,count:0},nc2:{done:false,count:0},nc3:{done:false,count:0},movie:{done:false,totalMinutes:0,movies:[]}};if(D.english[date].movie&&!D.english[date].movie.movies){D.english[date].movie.movies=[];if(D.english[date].movie.movieName||D.english[date].movie.minutes){D.english[date].movie.movies.push({id:uid(),name:D.english[date].movie.movieName||'',minutes:D.english[date].movie.minutes||0});D.english[date].movie.totalMinutes=D.english[date].movie.minutes||0};D.english[date].movie.movieName=undefined;D.english[date].movie.minutes=undefined};return D.english[date]}
function ensureNovel(){if(!D.novel)D.novel={content:'',baseline:{}};return D.novel}
function ensureWork(){if(!D.work)D.work={categories:[]};return D.work}
function ensureBudget(date){if(!D.budget)D.budget={};if(!D.budget[date])D.budget[date]={entries:[]};return D.budget[date]}
function ensureTravel(){if(!D.travel)D.travel={destinations:[]};return D.travel}
function ensurePlanning(){if(!D.planning)D.planning={};PLANNING_PERIODS.forEach(function(p){if(!D.planning[p.id])D.planning[p.id]={goal:'',tasks:[]}});return D.planning}
function ensureReview(){if(!D.review)D.review={daily:{},weekly:{},monthly:{},yearly:{},otherWork:{}};if(!D.review.otherWork)D.review.otherWork={};if(!D.review.monthly)D.review.monthly={};if(!D.review.yearly)D.review.yearly={};return D.review}

// ===================== PAGE: NOVEL =====================
function countWords(html){var tmp=document.createElement('div');tmp.innerHTML=html;var text=tmp.textContent||tmp.innerText||'';return text.replace(/\s/g,'').length}

var novelSpeedTracker={lastWordCount:0,lastTime:0,currentSpeed:0,samples:[],sampleWindow:60};
function updateTypingSpeed(currentCount){
  var now=Date.now();
  if(novelSpeedTracker.lastTime>0){var elapsed=(now-novelSpeedTracker.lastTime)/1000;
    if(elapsed>0.5){var wordsDiff=currentCount-novelSpeedTracker.lastWordCount;
      if(wordsDiff>0&&elapsed<300){var speed=Math.round(wordsDiff/(elapsed/60));
        novelSpeedTracker.samples.push({speed:speed,time:now});
        novelSpeedTracker.samples=novelSpeedTracker.samples.filter(function(s){return(now-s.time)<novelSpeedTracker.sampleWindow*1000});
        if(novelSpeedTracker.samples.length>0){var avg=novelSpeedTracker.samples.reduce(function(a,b){return a+b.speed},0)/novelSpeedTracker.samples.length;novelSpeedTracker.currentSpeed=Math.round(avg)}
      }
    }
  }
  novelSpeedTracker.lastWordCount=currentCount;novelSpeedTracker.lastTime=now;
}

function renderNovel(){
  var novel=ensureNovel();var dk=dateKey();
  if(novel.baseline[dk]===undefined){novel.baseline[dk]=countWords(novel.content);save()}
  var totalWords=countWords(novel.content);var todayWords=totalWords-(novel.baseline[dk]||0);if(todayWords<0)todayWords=0;
  var pct=Math.min(100,Math.round(todayWords/DAILY_GOAL*100));
  novelSpeedTracker.lastWordCount=totalWords;novelSpeedTracker.lastTime=Date.now();
  var html='<div class="card"><div class="card-title">每日写作目标 <span class="badge">'+pct+'%</span></div><div class="progress-info"><span>今日字数</span><span class="big">'+todayWords+' / '+DAILY_GOAL+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  html+='<div class="novel-stats"><div class="stat-box"><div class="num" style="color:var(--primary)">'+todayWords+'</div><div class="lbl">今日字数</div></div><div class="stat-box"><div class="num" style="color:var(--success)">'+totalWords+'</div><div class="lbl">总字数</div></div><div class="stat-box"><div class="num" style="color:#faad14">'+Math.max(0,DAILY_GOAL-todayWords)+'</div><div class="lbl">距目标</div></div><div class="speed-box"><div class="num" id="speed-display">0</div><div class="lbl">字/分钟</div></div></div>';
  html+='<div class="card" style="margin-top:14px"><div class="card-title">小说编辑器</div><div class="novel-toolbar"><button data-cmd="bold">B</button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="formatBlock" data-val="h3">标题</button><button data-cmd="formatBlock" data-val="p">正文</button></div><div class="novel-editor" id="novel-editor" contenteditable="true" data-placeholder="开始写作...">'+(novel.content||'')+'</div></div>';
  return html;
}
function initNovel(){
  var novel=ensureNovel();var dk=dateKey();var editor=document.getElementById('novel-editor');var speedDisplay=document.getElementById('speed-display');
  document.querySelectorAll('.novel-toolbar button').forEach(function(btn){btn.addEventListener('mousedown',function(e){e.preventDefault()});btn.addEventListener('click',function(e){e.preventDefault();document.execCommand(btn.dataset.cmd,false,btn.dataset.val||null);editor.focus();onEditorChange()})});
  function onEditorChange(){
    novel.content=editor.innerHTML;var total=countWords(novel.content);var today=total-(novel.baseline[dk]||0);if(today<0)today=0;var pct=Math.min(100,Math.round(today/DAILY_GOAL*100));
    updateTypingSpeed(total);if(speedDisplay)speedDisplay.textContent=novelSpeedTracker.currentSpeed;
    var fill=document.querySelector('.progress-fill');if(fill)fill.style.width=pct+'%';
    var infoBig=document.querySelector('.progress-info .big');if(infoBig)infoBig.textContent=today+' / '+DAILY_GOAL;
    var badge=document.querySelector('.card-title .badge');if(badge)badge.textContent=pct+'%';
    var stats=document.querySelectorAll('.stat-box .num');if(stats[0])stats[0].textContent=today;if(stats[1])stats[1].textContent=total;if(stats[2])stats[2].textContent=Math.max(0,DAILY_GOAL-today);
    debounce(function(){save();toast('已自动保存')},'novel_save',800);
  }
  editor.addEventListener('input',onEditorChange);
  var speedDecayInterval=setInterval(function(){
    var now=Date.now();novelSpeedTracker.samples=novelSpeedTracker.samples.filter(function(s){return(now-s.time)<novelSpeedTracker.sampleWindow*1000});
    if(novelSpeedTracker.samples.length>0){var avg=novelSpeedTracker.samples.reduce(function(a,b){return a+b.speed},0)/novelSpeedTracker.samples.length;novelSpeedTracker.currentSpeed=Math.round(avg)}else{novelSpeedTracker.currentSpeed=0}
    if(speedDisplay)speedDisplay.textContent=novelSpeedTracker.currentSpeed;
  },2000);
  window._novelSpeedInterval=speedDecayInterval;
}

function resizeImage(base64,maxWidth,quality,callback){
  var img=new Image();img.onload=function(){
    var w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}
    var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);callback(canvas.toDataURL('image/jpeg',quality||0.7));
  };img.src=base64;
}

function renderCalendar(){
  var y=calViewYear,m=calViewMonth;
  var todayDk=dateKey();
  var firstDay=new Date(y,m,1);
  var lastDay=new Date(y,m+1,0);
  var startWeekday=firstDay.getDay(); // 0=Sun
  var totalDays=lastDay.getDate();
  // Previous month days to fill
  var prevLastDay=new Date(y,m,0).getDate();
  var html='<div class="card"><div class="cal-nav">';
  html+='<span class="cal-arrow" data-action="calprev">◀</span>';
  html+='<span class="cal-title">'+y+'年'+(m+1)+'月</span>';
  html+='<span class="cal-arrow" data-action="calnext">▶</span>';
  html+='</div>';
  // Weekday headers
  html+='<div class="cal-grid">';
  WEEKDAYS.forEach(function(w){html+='<div class="cal-weekday">'+w+'</div>'});
  // Fill previous month
  for(var i=0;i<startWeekday;i++){
    var pd=prevLastDay-startWeekday+1+i;
    html+='<div class="cal-day other-month">'+pd+'</div>';
  }
  // Current month days
  for(var d=1;d<=totalDays;d++){
    var dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=dk===todayDk;
    var hasData=dayHasData(dk);
    var isSelected=dk===calSelectedDate&&!isToday;
    var cls='cal-day';
    var moodEmoji=D.mood&&D.mood[dk]&&D.mood[dk].level>0?D.mood[dk].emoji:'';
    if(isToday)cls+=' today';
    if(hasData)cls+=' has-data';
    if(isSelected)cls+=' selected';
    html+='<div class="'+cls+'" data-dk="'+dk+'" data-action="calday">'+d+(moodEmoji?'<span style="font-size:9px;display:block;line-height:1">'+moodEmoji+'</span>':'')+'</div>';
  }
  // Fill next month
  var totalCells=startWeekday+totalDays;
  var remaining=(7-totalCells%7)%7;
  for(var i=1;i<=remaining;i++){
    html+='<div class="cal-day other-month">'+i+'</div>';
  }
  html+='</div>';
  // Quick links
  html+='<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">';
  html+='<div class="cal-summary-btn" data-action="viewmonth">📊 查看'+(m+1)+'月总结</div>';
  html+='<div class="cal-summary-btn" data-action="viewyear">📊 查看'+y+'年总结</div>';
  html+='</div>';
  html+='</div>';
  // Selected date info
  if(calSelectedDate){
    html+=renderCalDayInfo(calSelectedDate);
  }
  return html;
}

function dayHasData(dk){
  if(D.plan&&D.plan[dk]&&D.plan[dk].length>0)return true;
  if(D.exercise&&D.exercise[dk])return true;
  if(D.english&&D.english[dk])return true;
  if(D.budget&&D.budget[dk]&&D.budget[dk].entries.length>0)return true;
  if(D.novel&&D.novel.baseline&&D.novel.baseline[dk]!==undefined)return true;
  if(D.mood&&D.mood[dk]&&D.mood[dk].level>0)return true;
  return false;
}

  var p=dk.split('-');var dateObj=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));

    if(moodData.text)html+='<div style="font-size:13px;color:var(--text2);line-height:1.6;background:#fffbe6;border-radius:6px;padding:8px;margin-top:4px">'+esc(moodData.text).substring(0,300)+(moodData.text.length>300?'...':'')+'</div>';

  }
  if(review.otherWork[dk]){
    html+='<div style="margin-top:6px;font-size:13px;color:var(--text2);line-height:1.6;background:#fffbe6;border-radius:6px;padding:8px">🛠️ '+esc(review.otherWork[dk]).substring(0,150)+(review.otherWork[dk].length>150?'...':'')+'</div>';
  }
  html+='</div>';
  return html;
}

function buildMiniDaySummary(dk){
  var planDone=0,planTotal=0,exDone=0,enDone=0,todayWords=0,workDone=0,workTotal=0,dayInc=0,dayExp=0;
  if(D.plan&&D.plan[dk]){planTotal=D.plan[dk].length;planDone=D.plan[dk].filter(function(t){return t.done}).length}
  if(D.exercise&&D.exercise[dk]){EXERCISE.forEach(function(e){if(D.exercise[dk].items[e.id])exDone++})}
  if(D.english&&D.english[dk]){
    var en=D.english[dk];
    if(en.nc1&&en.nc1.done)enDone++;if(en.nc2&&en.nc2.done)enDone++;if(en.nc3&&en.nc3.done)enDone++;
    if(en.movie&&(en.movie.done||(en.movie.movies&&en.movie.movies.length>0)))enDone++;
  }
  if(D.novel&&D.novel.baseline&&D.novel.baseline[dk]!==undefined){var tw=countWords(D.novel.content)-D.novel.baseline[dk];if(tw>0)todayWords=tw}
  if(D.work&&D.work.categories){D.work.categories.forEach(function(c){c.subtasks.forEach(function(s){workTotal++;if(s.done)workDone++})})}
  if(D.budget&&D.budget[dk]){D.budget[dk].entries.forEach(function(e){if(e.type==='income')dayInc+=e.amount;else dayExp+=e.amount})}
  var lines=[];
  if(planTotal>0)lines.push('📋 计划 '+planDone+'/'+planTotal);
  if(exDone>0)lines.push('💪 锻炼 '+exDone+'/4');
  if(enDone>0)lines.push('📖 英语 '+enDone+'/4');
  if(todayWords>0)lines.push('✍️ 小说 '+todayWords+'字');
  if(workTotal>0)lines.push('💼 工作 '+workDone+'/'+workTotal);
  if(dayInc>0||dayExp>0)lines.push('💰 收¥'+dayInc+' 支¥'+dayExp);
  if(lines.length===0)lines.push('<span style="color:var(--text2)">该日暂无数据</span>');
  return '<div style="font-size:13px;line-height:1.8">'+lines.join('<br>')+'</div>';
}

function buildDailySummary(){
  var dk=dateKey();var plan=ensurePlan(dk);var ex=ensureExercise(dk);var en=ensureEnglish(dk);var novel=ensureNovel();var bd=ensureBudget(dk);
  var planDone=plan.filter(function(t){return t.done}).length;

function downloadApp(){

    var blob=new Blob([html],{type:'text/html;charset=utf-8'});

    var m=mood[dk2];var h=m&&m.level>0?(m.level*18):5;
    var color=m&&m.level>0?MOOD_LEVELS[m.level-1].color:'#ddd';
    var emoji=m&&m.level>0?m.emoji:'';
    var dayLabel=(d.getMonth()+1)+'/'+d.getDate();
    html+='<div style="flex:1;text-align:center"><div class="mood-bar" style="height:'+h+'px;background:'+color+'">'+emoji+'</div><div class="mood-bar-date">'+dayLabel+'</div></div>';
  }
  html+='</div></div>';
  return html;
}

function renderMoodStats(){
  var mood=ensureMood();var mk=monthKey();
  var daysInMonth=new Date(parseInt(mk.split('-')[0]),parseInt(mk.split('-')[1]),0).getDate();
  var avgMood=0,moodDays=0,goodDays=0,badDays=0,streak=0,currentStreak=0;
  for(var d=1;d<=daysInMonth;d++){
    var dk2=mk+'-'+String(d).padStart(2,'0');
    if(mood[dk2]&&mood[dk2].level>0){
      moodDays++;avgMood+=mood[dk2].level;
      if(mood[dk2].level>=4)goodDays++;
      if(mood[dk2].level<=2)badDays++;
      // Check streak from today backwards
      var todayDk=dateKey();
      if(dk2<=todayDk){
        if(mood[dk2].level>=4){currentStreak++;if(currentStreak>streak)streak=currentStreak}
        else{currentStreak=0}
      }
    }
  }
  if(moodDays>0)avgMood=Math.round(avgMood/moodDays*10)/10;
  var html='<div class="card"><div class="card-title">本月心情统计</div>';
  html+='<div class="mood-stats">';
  html+='<div class="mood-stat-item"><div class="num">'+avgMood+'</div>平均心情</div>';
  html+='<div class="mood-stat-item"><div class="num">'+moodDays+'/'+daysInMonth+'</div>记录天数</div>';
  html+='<div class="mood-stat-item"><div class="num" style="color:var(--success)">'+goodDays+'</div>好心情天</div>';
  html+='<div class="mood-stat-item"><div class="num" style="color:var(--danger)">'+badDays+'</div>低落天</div>';
  html+='</div>';
  if(streak>0)html+='<div style="text-align:center;margin-top:10px;font-size:14px;color:var(--success);font-weight:600">🎉 连续好心情最长 '+streak+' 天</div>';
  html+='</div>';
  return html;
}

function initMood(){
  var mood=ensureMood();var dk=dateKey();
  // Emoji clicks
  document.querySelectorAll('.mood-emoji').forEach(function(el){
    el.addEventListener('click',function(){
      var lv=parseInt(el.dataset.lv);var emoji=el.dataset.emoji;
      mood[dk]={level:lv,emoji:emoji,text:mood[dk]?mood[dk].text:''};
      save();renderPage();toast('心情已记录: '+emoji);
    });
  });
  // Diary text
  var diaryEl=document.getElementById('mood-diary-text');
  if(diaryEl){diaryEl.addEventListener('input',function(){
    if(!mood[dk])mood[dk]={level:0,emoji:'',text:''};
    mood[dk].text=diaryEl.value;debounce(function(){save();toast('日记已保存')},'mood_t');
  })}
}

// ===================== PAGE: GOAL PROGRESS =====================
var GOAL_PERIODS=[{id:'1w',label:'一周目标'},{id:'1m',label:'一月目标'},{id:'3m',label:'三月目标'},{id:'6m',label:'半年目标'},{id:'1y',label:'一年目标'},{id:'3y',label:'三年目标'},{id:'5y',label:'五年目标'}];

function renderGoal(){
  var planning=ensurePlanning();var goalLog=ensureGoalLog();var dk=dateKey();
  // Calculate total progress
  var totalDone=0,totalMilestones=0;
  PLANNING_PERIODS.forEach(function(p){
    var period=planning[p.id];
    totalMilestones+=period.tasks.length;
    period.tasks.forEach(function(t){if(t.done)totalDone++});
  });
  var totalPct=totalMilestones>0?Math.round(totalDone/totalMilestones*100):0;
  // Total ring
  var totalColor=totalPct<30?'var(--danger)':(totalPct<70?'var(--warn)':'var(--success)');
  var html='<div class="goal-total-ring">';
  html+='<svg class="goal-total-svg" viewBox="0 0 120 120">';
  html+='<circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="10"/>';
  html+='<circle cx="60" cy="60" r="50" fill="none" stroke="'+totalColor+'" stroke-width="10" stroke-dasharray="'+(totalPct*3.14)+' 314" stroke-linecap="round" transform="rotate(-90 60 60)"/>';
  html+='<text x="60" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="'+totalColor+'">'+totalPct+'%</text>';
  html+='<text x="60" y="75" text-anchor="middle" font-size="11" fill="var(--text2)">总体进度</text>';
  html+='</svg>';
  html+='<div class="goal-total-label">'+totalDone+'/'+totalMilestones+' 个里程碑已完成</div>';
  html+='</div>';
  // Individual goal rings
  html+='<div class="goal-ring-container">';
  PLANNING_PERIODS.forEach(function(p){
    var period=planning[p.id];
    var done=period.tasks.filter(function(t){return t.done}).length;
    var total=period.tasks.length;
    var pct=total>0?Math.round(done/total*100):0;
    var color=pct<30?'var(--danger)':(pct<70?'var(--warn)':'var(--success)');
    var pctClass=pct<30?'red':(pct<70?'yellow':'green');
    html+='<div class="goal-ring">';
    html+='<div class="goal-ring-label">'+esc(p.name)+'</div>';
    html+='<svg class="goal-ring-svg" viewBox="0 0 80 80">';
    html+='<circle cx="40" cy="40" r="30" fill="none" stroke="var(--border)" stroke-width="8"/>';
    html+='<circle cx="40" cy="40" r="30" fill="none" stroke="'+color+'" stroke-width="8" stroke-dasharray="'+(pct*1.88)+' 188" stroke-linecap="round" transform="rotate(-90 40 40)"/>';
    html+='<text x="40" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="'+color+'">'+pct+'%</text>';
    html+='</svg>';
    html+='<div class="goal-ring-pct '+pctClass+'">'+done+'/'+total+'</div>';
    html+='</div>';
  });
  html+='</div>';
  // Progress log
  html+='<div class="card"><div class="card-title">今日进度日志</div>';
  html+='<textarea id="goal-log-text" placeholder="记录今天在哪个目标上做了什么推进..." style="min-height:120px">'+esc(goalLog[dk]||'')+'</textarea>';
  html+='</div>';
  return html;
}

function initGoal(){
  var goalLog=ensureGoalLog();var dk=dateKey();
  var logEl=document.getElementById('goal-log-text');
  if(logEl){logEl.addEventListener('input',function(){
    goalLog[dk]=logEl.value;debounce(function(){save();toast('进度日志已保存')},'goal_t');
  })}
}

// ===================== PAGE: DATA EXPORT =====================
function renderExport(){
  var html='<div class="export-section">';
  // Full backup export
  html+='<div class="export-btn" data-action="export-all"><span class="export-icon">💾</span><div class="export-info"><div class="title">全量备份导出</div><div class="desc">导出所有数据为JSON文件，可用于换手机恢复</div></div></div>';
  // Import from backup
  html+='<div class="export-btn" data-action="import-all"><span class="export-icon">📥</span><div class="export-info"><div class="title">从备份恢复数据</div><div class="desc">从JSON备份文件导入还原所有数据（会覆盖当前数据）</div></div></div>';
  html+='<input type="file" id="import-file" class="import-file-input" accept=".json">';
  html+='</div>';
  html+='<div class="export-section">';
  // Budget CSV
  html+='<div class="export-btn" data-action="export-budget"><span class="export-icon">📊</span><div class="export-info"><div class="title">记账数据导出</div><div class="desc">导出本月收支明细为CSV表格</div></div></div>';
  // Review text
  html+='<div class="export-btn" data-action="export-review"><span class="export-icon">📝</span><div class="export-info"><div class="title">复盘文本导出</div><div class="desc">导出日报/周报/月报/年报文本为TXT</div></div></div>';
  // Mood data
  html+='<div class="export-btn" data-action="export-mood"><span class="export-icon">😊</span><div class="export-info"><div class="title">心情日记导出</div><div class="desc">导出所有心情记录为CSV</div></div></div>';
  html+='</div>';
  html+='<div class="export-section">';
  // Image report
  html+='<div class="export-btn" data-action="export-report"><span class="export-icon">🖼️</span><div class="export-info"><div class="title">生成数据报告图片</div><div class="desc">生成今日/本周数据概览图片，可分享</div></div></div>';
  html+='</div>';
  return html;
}

function initExport(){
  document.querySelector('[data-action=export-all]').addEventListener('click',function(){exportAllData()});
  document.querySelector('[data-action=import-all]').addEventListener('click',function(){document.getElementById('import-file').click()});
  document.getElementById('import-file').addEventListener('change',function(e){importAllData(e)});
  document.querySelector('[data-action=export-budget]').addEventListener('click',function(){exportBudgetCSV()});
  document.querySelector('[data-action=export-review]').addEventListener('click',function(){exportReviewText()});
  document.querySelector('[data-action=export-mood]').addEventListener('click',function(){exportMoodCSV()});
  document.querySelector('[data-action=export-report]').addEventListener('click',function(){generateReportImage()});
}

function exportAllData(){
  var json=JSON.stringify(D,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='daily-life-backup-'+dateKey()+'.json';a.click();
  URL.revokeObjectURL(a.href);toast('备份文件已下载');
}

function importAllData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(confirm('导入将覆盖当前所有数据，确定继续吗？')){
        D=data;saveData(D);renderPage();toast('数据已恢复！');
      }
    }catch(err){toast('文件格式错误，请选择正确的备份JSON文件')}
  };
  reader.readAsText(file);
}

function exportBudgetCSV(){
  var mk=monthKey();var bd=D.budget||{};
  var lines=['日期,类型,分类,金额,备注,心情'];
  Object.keys(bd).sort().forEach(function(dk){
    if(!dk.startsWith(mk))return;
    var b=bd[dk];if(!b||!b.entries)return;
    b.entries.forEach(function(en){
      lines.push(dk+','+en.type+','+esc(en.category||'')+','+en.amount+','+esc(en.note||'')+','+esc(en.mood||''));
    });
  });
  if(lines.length===1){toast('本月暂无记账数据');return}
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='budget-'+mk+'.csv';a.click();URL.revokeObjectURL(a.href);toast('记账CSV已下载');
}

function exportReviewText(){
  var review=ensureReview();var mk=monthKey();var yk=yearKey();
  var lines=['===== 复盘文本导出 =====',''];
  Object.keys(review.daily).sort().reverse().forEach(function(dk){
    lines.push('【日报 '+dk+'】');lines.push(review.daily[dk]||'');lines.push('');
  });
  lines.push('【周报】');Object.keys(review.weekly).sort().reverse().forEach(function(wk){lines.push('周: '+wk);lines.push(review.weekly[wk]||'');lines.push('')});
  lines.push('【月报 '+mk+'】');lines.push(review.monthly[mk]||'');lines.push('');
  lines.push('【年报 '+yk+'】');lines.push(review.yearly[yk]||'');lines.push('');
  var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='review-'+dateKey()+'.txt';a.click();URL.revokeObjectURL(a.href);toast('复盘文本已下载');
}

function exportMoodCSV(){
  var mood=ensureMood();
  var lines=['日期,心情等级,心情,日记内容'];
  Object.keys(mood).sort().forEach(function(dk){
    var m=mood[dk];if(!m||m.level===0)return;
    lines.push(dk+','+m.level+','+m.emoji+','+esc((m.text||'').substring(0,100)));
  });
  if(lines.length===1){toast('暂无心情记录');return}
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mood-'+dateKey()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('心情CSV已下载');
}

function generateReportImage(){
  // Create a canvas-based report card
  var canvas=document.createElement('canvas');canvas.width=600;canvas.height=800;
  var ctx=canvas.getContext('2d');
  // Background
  ctx.fillStyle='#f0f2f5';ctx.fillRect(0,0,600,800);
  ctx.fillStyle='#fff';ctx.fillRect(20,20,560,760);
  // Title
  ctx.fillStyle='#4a90d9';ctx.font='bold 24px sans-serif';ctx.fillText('📊 每日数据报告',180,60);
  ctx.fillStyle='#888';ctx.font='14px sans-serif';ctx.fillText(fmtDate(),200,85);
  // Stats
  var y=120;ctx.font='16px sans-serif';
  var summary=buildDailySummary();
  var summaryText=summary.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  var lines=summaryText.split('\n');
  lines.forEach(function(line){
    if(line.trim()){
      ctx.fillStyle='#1a1a1a';ctx.fillText(line.trim(),40,y);
      y+=28;
    }
  });
  // Mood
  var mood=ensureMood();var dk=dateKey();
  if(mood[dk]&&mood[dk].level>0){
    ctx.fillStyle='#52c41a';ctx.font='bold 18px sans-serif';
    ctx.fillText('今日心情: '+mood[dk].emoji+' '+MOOD_LEVELS[mood[dk].level-1].label,40,y);
    y+=30;
  }
  // Footer
  ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.fillText('Generated by 每日管理 App',200,780);
  // Download
  canvas.toBlob(function(blob){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='daily-report-'+dateKey()+'.png';a.click();URL.revokeObjectURL(a.href);toast('报告图片已下载');
  },'image/png');
}

// ===================== INIT =====================
renderSidebar();
renderPage();
</script>
